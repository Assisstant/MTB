<!doctype html>
<html lang="mk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Вежби за изговор</title>
<style>
  :root {
    --bg: #f4f6f8; --card: #ffffff; --ink: #1d2733; --soft: #5b6877; --line: #d5dbe2;
    --target: #d62828; --chosen: #136990; --on-chosen: #ffffff; --box: #eef2f6;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--bg); color: var(--ink); font-family: "Segoe UI", system-ui, -apple-system, Arial, sans-serif; }
  /* One row, whatever the screen: what does not fit goes into a menu (fitBar),
     so the cards keep the window. The letter box, the tile and the key share
     one size, --u. */
  body { --u: 44px; }
  header { display: flex; align-items: center; gap: 6px; padding: 6px 12px; background: var(--card); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 4; white-space: nowrap; }
  header[data-tight="4"] { flex-wrap: wrap; }
  header[data-tight="2"] .lbl, header[data-tight="3"] .lbl, header[data-tight="4"] .lbl { display: none; }
  .seg { display: inline-flex; flex-wrap: wrap; gap: 4px; }
  .seg button, .plain { font: inherit; font-size: 14px; font-weight: 600; color: var(--ink); background: var(--box); border: 1px solid var(--line); border-radius: 999px; padding: 6px 14px; min-height: 34px; cursor: pointer; }
  .seg button[aria-pressed="true"], .plain[aria-pressed="true"], .plain.on { background: var(--chosen); border-color: var(--chosen); color: var(--on-chosen); }
  .group { display: inline-flex; align-items: center; gap: 4px; flex: none; }
  .grow { flex: 1 1 0; min-width: 0; }
  #view button { display: inline-flex; align-items: center; gap: 6px; }
  #view svg { flex: none; width: 16px; height: 16px; fill: currentColor; }
  main { padding: 16px; max-width: 1200px; margin: 0 auto; }
  .hint { color: var(--soft); font-size: 14px; margin: 0 0 14px; }

  /* менија во лентата */
  .menu { position: relative; flex: none; }
  .opener b { color: var(--target); font-size: 18px; line-height: 1; }
  .opener::after { content: '▾'; margin-left: 6px; font-size: 11px; color: var(--soft); }
  .opener.bare { padding: 6px 12px; font-size: 18px; line-height: 1; }
  .opener.bare::after { content: none; }
  .pop { display: none; position: absolute; top: calc(100% + 6px); left: 0; z-index: 6; padding: 8px; background: var(--card); border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 10px 30px rgba(20, 30, 50, .18); white-space: nowrap; }
  .menu.end .pop { left: auto; right: 0; }
  .menu.open .pop { display: block; }
  .pop .seg { max-width: min(330px, 100vw - 34px); }
  #sound { display: grid; grid-template-columns: repeat(7, 40px); }
  #sound button { padding: 0; height: 40px; }
  .pop .seg.col, .pop.list { flex-direction: column; flex-wrap: nowrap; align-items: stretch; min-width: 190px; }
  .menu.open .pop.list { display: flex; gap: 4px; }
  .pop .seg.col button, .pop.list .plain { text-align: left; border-radius: 10px; }
  .pop.list hr { width: 100%; margin: 2px 0; border: 0; border-top: 1px solid var(--line); }
  /* the same buttons in the row itself, while it holds them */
  .menu.inline .opener { display: none; }
  .menu.inline .pop { display: block; position: static; padding: 0; border: 0; border-radius: 0; box-shadow: none; background: none; }
  .menu.inline .pop .seg { flex-direction: row; flex-wrap: nowrap; max-width: none; min-width: 0; }
  .menu.inline .pop .seg.col button { text-align: center; border-radius: 999px; }
  .menu.inline + .menu.inline { margin-left: 4px; padding-left: 10px; border-left: 1px solid var(--line); }

  /* слогови */
  .syll { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; max-width: 760px; margin: 0 auto; }
  .syll button { font: inherit; font-size: clamp(30px, 7vw, 64px); font-weight: 600; color: var(--ink); background: var(--card); border: 2px solid var(--line); border-radius: 16px; padding: 10px 6px; cursor: pointer; letter-spacing: .04em; }
  .syll button.done { background: #e6f4ea; border-color: #7fbf90; }

  /* зборови */
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 14px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 14px; display: flex; flex-direction: column; align-items: center; gap: 12px; user-select: none; }
  .pic { font: inherit; color: var(--ink); background: transparent; border: 0; border-radius: 12px; padding: 0; width: 100%; display: flex; flex-direction: column; align-items: center; gap: 12px; cursor: pointer; }
  .syll button:focus-visible, button:focus-visible { outline: 3px solid var(--chosen); outline-offset: 2px; }
  .pics { display: flex; justify-content: center; gap: 8px; width: 100%; }
  .pics img, .ph { flex: 0 1 240px; min-width: 0; aspect-ratio: 1; object-fit: contain; }
  .ph { display: grid; place-items: center; font-size: 44px; color: var(--soft); background: var(--box); border: 2px dashed var(--line); border-radius: 16px; }
  .word { display: flex; align-items: center; justify-content: center; gap: 4px; min-height: 60px; }
  .ltr { width: 42px; height: 56px; display: grid; place-items: center; font-size: 34px; font-weight: 700; background: var(--box); border: 2px solid var(--line); border-radius: 10px; }
  .ltr.t { color: var(--target); border-color: var(--target); background: #fff; }
  .ltr.empty { color: transparent; }
  .dash { font-size: 34px; font-weight: 700; color: var(--soft); padding: 0 2px; }
  .word.hidden { visibility: hidden; }
  /* a long word still fits its card: the boxes narrow, the letters get smaller */
  .word { max-width: 100%; }
  .ltr { flex: 0 1 auto; min-width: 0; }
  .word.long .ltr { font-size: 24px; }
  .one .word.long .ltr { font-size: 40px; }

  /* реченици: помали кутии, преломот е меѓу зборови */
  .cards.wide { grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); }
  .sent { flex-wrap: wrap; gap: 8px 16px; }
  .grp { display: inline-flex; align-items: center; gap: 3px; max-width: 100%; }
  .sent .ltr { width: 30px; height: 42px; font-size: 24px; border-radius: 8px; }
  .sent .dash { font-size: 24px; padding: 0; }
  .gap { width: 96px; height: 42px; border-bottom: 3px solid var(--ink); }
  .one .sent .ltr { width: 44px; height: 58px; font-size: 36px; }
  .one .sent .dash { font-size: 36px; }
  .one .gap { width: 150px; height: 58px; }
  .ltr.got { background: #e6f4ea; }
  .card.pop .ltr.got { animation: pop .5s; }
  @keyframes pop { 40% { transform: scale(1.25); } }

  /* букви за влечење */
  .tray { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
  .tray.spent, .tile.gone { visibility: hidden; }
  .tile { font: inherit; font-size: 34px; font-weight: 700; color: var(--ink); background: #fff8e1; border: 2px solid #e0b84a; border-radius: 10px; width: 48px; height: 56px; padding: 0; cursor: grab; touch-action: none; position: relative; box-shadow: 0 2px 0 #e0b84a; }
  .tile.lift, .key.lift { z-index: 5; cursor: grabbing; box-shadow: 0 8px 16px rgba(0, 0, 0, .25); }
  .tile.back, .key.back { transition: transform .2s; }
  .tile.no { animation: no .35s; border-color: var(--target); }
  .key.no { animation: no .35s; background: var(--target); }
  @keyframes no { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
  /* the box a tapped letter goes to; after two wrong tries its letter shows faintly */
  .ltr.aim { box-shadow: 0 0 0 3px var(--chosen); }
  .ltr.empty.faint { color: #b3bcc7; }
  .drop { cursor: pointer; }

  /* ѕвезда за составен збор */
  .card { position: relative; }
  .star { position: absolute; top: 8px; right: 10px; font-size: 32px; line-height: 1; pointer-events: none; }
  .card.pop .star { animation: star .7s; }
  @keyframes star { 0% { transform: scale(0) rotate(-180deg); } 60% { transform: scale(1.5); } }

  /* тастатура, распоред како во ComuniBoard */
  /* a key is the size of a letter box, so a dragged key lands in the box as the
     same shape; only a screen too narrow for twelve of them makes it smaller */
  .keys { position: fixed; left: 50%; bottom: 8px; transform: translateX(-50%); z-index: 3; --k: min(var(--u), (100vw - 76px) / 12); padding: 8px; background: rgba(15, 23, 42, .95); border-radius: 12px; box-shadow: 0 8px 32px rgba(0, 0, 0, .4); user-select: none; }
  .keys[hidden] { display: none; }
  .keys div { display: flex; justify-content: center; gap: 4px; }
  .keys div + div { margin-top: 4px; }
  .key { font: inherit; font-size: max(19px, calc(var(--k) * .7)); font-weight: 700; color: #f1f5f9; background: #334155; border: 0; border-radius: 8px; width: var(--k); height: max(42px, calc(var(--k) * 1.2)); padding: 0; cursor: grab; touch-action: none; position: relative; }
  .key.shut { background: transparent; color: #94a3b8; cursor: pointer; margin-left: var(--k); }

  /* глас */
  .tools { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; }
  .tools .plain.live { background: var(--target); border-color: var(--target); color: #ffffff; }
  .note { color: var(--target); font-size: 14px; margin: 0 0 14px; }
  .note:empty { display: none; }

  /* избор на слика */
  dialog { border: 0; border-radius: 16px; padding: 16px; width: min(720px, 94vw); max-height: 90vh; color: var(--ink); background: var(--card); }
  dialog::backdrop { background: rgba(0, 0, 0, .45); }
  .pk-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 0 0 12px; font-size: 18px; }
  .pk-find { display: flex; gap: 8px; margin-bottom: 10px; }
  .pk-find input { flex: 1; min-width: 0; font: inherit; font-size: 16px; color: var(--ink); background: #fff; border: 1px solid var(--line); border-radius: 999px; padding: 6px 14px; }
  #pk-out { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 8px; margin-bottom: 12px; }
  #pk-out button { background: #fff; border: 2px solid var(--line); border-radius: 12px; padding: 4px; cursor: pointer; }
  #pk-out img { display: block; width: 100%; aspect-ratio: 1; object-fit: contain; }

  /* една по една */
  /* The card takes the window (body.fit): the picture gets what the bar, the
     boxes and the keyboard leave, so picture, boxes and 🔊 are in sight on a
     low screen too, and nothing scrolls. --u follows the window's height. */
  body.fit { --u: clamp(40px, calc((100vh - 260px) / 9), 76px); height: 100vh; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }
  body.fit.focus { --u: clamp(40px, calc((100vh - 170px) / 9), 80px); }
  body.fit #vezbi { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  body.fit main { flex: 1; min-height: 0; width: 100%; display: flex; flex-direction: column; padding: 10px 12px 4px; overflow: auto; }
  body.fit .hint, body.fit .note { margin-bottom: 8px; }
  body.fit #out { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  body.fit footer { padding: 0 12px 6px; font-size: 11px; text-align: center; }
  .one { flex: 1 1 0; min-height: 250px; display: grid; grid-template-columns: auto minmax(0, 640px) auto; grid-template-rows: minmax(0, 1fr) auto; grid-template-areas: "prev card next" ". count ."; align-items: center; justify-content: center; gap: 6px 12px; }
  .one .card { grid-area: card; height: 100%; min-height: 0; padding: 14px 18px; gap: 10px; }
  .nav.prev { grid-area: prev; }
  .nav.next { grid-area: next; }
  .one .pic { flex: 1; min-height: 0; gap: 10px; }
  .one .pics { flex: 1; min-height: 0; align-items: stretch; }
  .one .pics img, .one .ph { flex: 0 1 auto; }
  .one .word { min-height: calc(var(--u) * 1.2); }
  .one .ltr, .one .tile { width: var(--u); height: calc(var(--u) * 1.2); font-size: calc(var(--u) * .8); }
  .one .dash { font-size: calc(var(--u) * .66); }
  .one .word.long .ltr { font-size: calc(var(--u) * .55); }
  .one .sent .ltr { width: calc(var(--u) * .7); height: calc(var(--u) * .9); font-size: calc(var(--u) * .56); }
  .one .sent .dash { font-size: calc(var(--u) * .56); }
  .one .gap { width: calc(var(--u) * 2.2); height: calc(var(--u) * .9); }
  /* 🔊 alone sits in the card's corner and takes no row of its own */
  .one .tools:not(.edit) { position: absolute; top: 10px; left: 10px; }
  .one .tools:not(.edit) .plain { width: 46px; height: 46px; padding: 0; font-size: 20px; }
  .nav { font: inherit; font-size: 34px; width: 60px; height: 60px; border-radius: 50%; border: 1px solid var(--line); background: var(--card); color: var(--ink); cursor: pointer; }
  .count { grid-area: count; display: flex; align-items: center; justify-content: center; gap: 12px; color: var(--soft); font-size: 14px; }

  /* цел екран: само картичките */
  body.focus .apps, body.focus header { display: none; }
  #unfocus { position: fixed; top: 8px; right: 8px; z-index: 4; width: 40px; padding: 0; opacity: .75; }

  /* делови: јазичиња горе, и почетна со плочки како Контролната табла на MTB */
  [hidden] { display: none !important; }
  .apps { display: flex; gap: 4px; padding: 4px 12px; background: #1b2a4e; overflow-x: auto; }
  .apps button { flex: none; font: inherit; font-size: 13px; font-weight: 600; color: #dce4f7; background: transparent; border: 0; border-radius: 999px; padding: 4px 12px; min-height: 28px; cursor: pointer; }
  @media (pointer: coarse) { .apps button { min-height: 34px; } }
  .apps button[aria-pressed="true"] { background: #ffffff; color: #1b2a4e; }
  /* the tabs of the tool in the frame, shown here so the tool needs no row of its own */
  .apps .sub { display: inline-flex; align-items: center; gap: 4px; margin: 0 6px 0 2px; padding-left: 8px; border-left: 1px solid rgba(220, 228, 247, .35); }
  .apps .sub button { border: 1px solid rgba(220, 228, 247, .35); }
  .apps .sub button[aria-pressed="true"] { background: #c7d2fe; border-color: #c7d2fe; color: #1b2a4e; }
  /* a tool in a frame asked for the whole window */
  body.bare .apps { display: none; }
  /* the way to the diary, at the far end; only where the diary lives (see `diary`) */
  .apps .diary { flex: none; margin-left: auto; font-size: 13px; font-weight: 600; color: #dce4f7; text-decoration: none; border: 1px solid rgba(220, 228, 247, .35); border-radius: 999px; padding: 4px 12px; min-height: 28px; display: inline-flex; align-items: center; }
  .apps .diary:hover { background: rgba(255, 255, 255, .12); }
  .apps .diary:focus-visible { outline: 3px solid #ffffff; outline-offset: 2px; }
  .apps button:focus-visible { outline-color: #ffffff; }
  .home { padding: 28px 16px 40px; background: linear-gradient(135deg, #dce8fb, #ece7fa 50%, #d3f0e4); min-height: calc(100vh - 110px); }
  .home > * { max-width: 1060px; margin-left: auto; margin-right: auto; }
  .home h2 { font-size: clamp(24px, 5vw, 32px); color: #2563d9; margin-top: 0; margin-bottom: 6px; }
  .home-sub { color: #56627f; margin-top: 0; margin-bottom: 22px; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 18px; }
  .app { --c: #2f6fe4; font: inherit; text-align: left; color: #3b4663; background: rgba(255, 255, 255, .93); border: 1px solid rgba(47, 111, 228, .09); border-radius: 18px; padding: 0 0 16px; overflow: hidden; cursor: pointer; display: flex; flex-direction: column; box-shadow: 0 6px 18px rgba(42, 74, 143, .10); transition: box-shadow .15s, transform .15s; }
  .app:hover { box-shadow: 0 10px 26px rgba(42, 74, 143, .22); transform: translateY(-2px); }
  .app img { display: block; width: 100%; aspect-ratio: 16 / 10; object-fit: cover; object-position: top left; background: var(--box); border-bottom: 1px solid var(--line); }
  .app-head { display: flex; align-items: center; gap: 12px; padding: 14px 16px 0; }
  .chip { flex: none; width: 48px; height: 48px; border-radius: 14px; display: grid; place-items: center; font-size: 24px; background: var(--c); }
  .app-name { font-size: 19px; font-weight: 700; color: #1b2a4e; }
  .app-text { display: block; margin: 10px 16px 0; font-size: 14px; line-height: 1.45; }
  .app-when { display: block; margin: 12px 16px 0; padding: 7px 12px; border-radius: 10px; font-size: 13px; font-weight: 600; color: #33405e; background: color-mix(in srgb, var(--c) 10%, #ffffff); }
  /* another app in a frame takes the rest of the window */
  body.framed { display: flex; flex-direction: column; height: 100vh; height: 100dvh; }
  .frame { flex: 1; width: 100%; border: 0; background: #ffffff; }
  body.framed footer { display: none; }

  footer { max-width: 1200px; margin: 0 auto; padding: 8px 16px 24px; color: var(--soft); font-size: 12px; }
  .sheet-head { display: none; }

  @media (max-width: 560px) {
    header { position: static; }
    /* the arrows go under the card, beside the count; the card keeps the whole width */
    .one { grid-template-columns: auto minmax(0, 1fr) auto; grid-template-areas: "card card card" "prev count next"; }
    .one .card { padding: 12px; }
    .nav { width: 44px; height: 44px; font-size: 26px; }
  }

  @media print {
    @page { size: A4; margin: 12mm; }
    body { background: #fff; }
    header, .hint, .note, .nav, .count, .tray, .tools, .keys, .star, .apps, #unfocus { display: none !important; }
    body { padding-bottom: 0 !important; }
    .ltr.aim { box-shadow: none; }
    .ltr.empty.faint { color: transparent; }
    main { padding: 0; max-width: none; }
    .sheet-head { display: flex; justify-content: space-between; font-size: 14pt; margin-bottom: 8mm; }
    .cards { grid-template-columns: repeat(3, 1fr); gap: 6mm; }
    .card { break-inside: avoid; border-color: #999; }
    .pics img, .ph { flex-basis: 42mm; }
    .ph { color: transparent; background: #fff; border-color: #999; }
    .cards.wide { grid-template-columns: repeat(2, 1fr); }
    .ltr { background: #fff; border-color: #666; }
    .ltr.t { border-color: var(--target); }
    footer { padding: 6mm 0 0; font-size: 8pt; }
  }
</style>
</head>
<body>
<nav class="apps" id="apps" aria-label="Делови"></nav>

<section class="home" id="home">
  <h2>Вежби — Контролна табла</h2>
  <p class="home-sub">Три алатки на едно место. Допри плочка за да ја отвориш; јазичињата горе водат од една во друга.</p>
  <div class="tiles" id="tiles"></div>
</section>

<iframe class="frame" id="tabla" title="ComuniBoard" allow="clipboard-read *; clipboard-write *" hidden></iframe>
<iframe class="frame" id="crtanje" title="WBACC Studio" allow="clipboard-read *; clipboard-write *" hidden></iframe>

<div id="vezbi" hidden>
<header id="bar" aria-label="Вежба">
  <div class="menu" id="m-sound">
    <button class="plain opener" title="Глас" aria-haspopup="true" aria-expanded="false"><span class="lbl">Глас </span><b id="letter"></b></button>
    <div class="pop"><div class="seg" id="sound"></div></div>
  </div>
  <div class="menu" id="m-stage">
    <button class="plain opener" title="Вежба" aria-haspopup="true" aria-expanded="false"><span id="stage-now"></span></button>
    <div class="pop"><div class="seg" id="stage"></div></div>
  </div>
  <div class="menu" id="m-step">
    <button class="plain opener" title="Помош" aria-haspopup="true" aria-expanded="false"><span id="step-now"></span></button>
    <div class="pop"><div class="seg col" id="step">
      <button data-v="0">Цел збор</button>
      <button data-v="1">Без П</button>
      <button data-v="2">Само цртички</button>
      <button data-v="3">Само слика</button>
    </div></div>
  </div>
  <span class="grow"></span>
  <div class="group">
    <div class="seg" id="view">
      <button data-v="grid" title="Сите заедно" aria-label="Сите заедно"><svg viewBox="0 0 16 16" aria-hidden="true"><rect x="1" y="1" width="6" height="6" rx="1.5"/><rect x="9" y="1" width="6" height="6" rx="1.5"/><rect x="1" y="9" width="6" height="6" rx="1.5"/><rect x="9" y="9" width="6" height="6" rx="1.5"/></svg><span class="lbl">Сите заедно</span></button>
      <button data-v="one" title="Една по една" aria-label="Една по една"><svg viewBox="0 0 16 16" aria-hidden="true"><rect x="3" y="1" width="10" height="14" rx="2"/></svg><span class="lbl">Една по една</span></button>
    </div>
    <button class="plain" id="kb" title="Тастатура" aria-label="Тастатура" aria-pressed="false">⌨<span class="lbl"> Тастатура</span></button>
  </div>
  <div class="menu end" id="m-more">
    <button class="plain opener bare" id="more" title="Повеќе" aria-label="Повеќе" aria-haspopup="true" aria-expanded="false">⋯</button>
    <div class="pop list">
      <button class="plain" id="shuffle">🔀 Измешај</button>
      <button class="plain" id="full">⛶ Цел екран</button>
      <button class="plain" id="tips" aria-pressed="false">💡 Упатство</button>
      <button class="plain" id="print">🖨 Работен лист</button>
      <hr>
      <button class="plain" id="edit" aria-pressed="false">✏️ Уреди</button>
      <button class="plain" id="export">⬇ Извези</button>
    </div>
  </div>
</header>

<main>
  <div class="sheet-head"><span id="sheet-letter"></span><span>Име: ______________________</span><span>Датум: ____________</span></div>
  <p class="hint" id="hint"></p>
  <p class="note" id="note" role="status"></p>
  <div id="out"></div>
</main>
</div>

<div class="keys" id="keys" hidden></div>

<script>const GLASOVI = [];</script>

<script>
// One sound = one file in glasovi/, listed in the <script> tags above. Each
// file adds { letter, file, words, sentences, img } to GLASOVI. A new sound = a
// new file and one more tag; the syllables are made from the letter. A word or
// sentence without `img` has no picture yet: its key in `img` is its own text.
const VOWELS = 'ауеио';
// Wrong letters offered next to the right one when a letter is dragged in.
const DISTRACTORS = 'пбтмкдн';
// The on-screen keyboard, in ComuniBoard's Macedonian layout.
const KEYS = ['љњертѕуиопшѓ', 'асдфгхјклчќ', 'зжџцвбнм'];

let TARGET, SYLLABLES, WORDS, SENTENCES, IMG;
// Per card (by its index in the list): `own` step, `filled` box positions,
// `tiles` offered, `used` tile numbers, `miss` wrong tries per box. `sel` is
// the box chosen by a tap, `kb` the keyboard instead of the tiles. `zoomed`:
// the one card on screen was opened from „Сите заедно"; `focus`: only the
// cards, no bar; `tips`: the line of instructions, off on a low or narrow screen.
const state = { app: 'home', sound: 0, stage: 'syll', step: 0, view: 'grid', order: [], at: 0, own: {}, done: {}, filled: {}, tiles: {}, used: {}, miss: {}, sel: null, kb: false, flash: -1, edit: false, zoomed: false, focus: false, tips: window.innerHeight >= 760 && window.innerWidth >= 700 };
const $ = (id) => document.getElementById(id);
const out = $('out');

const sentences = () => state.stage === 'sent';
const list = () => (sentences() ? SENTENCES : WORDS);
const plain = (item) => (item.w || item.s).replace(/[{}]/g, '');
const upper = () => TARGET.toUpperCase();
const keysOf = (item) => [].concat(item.img || plain(item));
const picture = (key) => own[key] || IMG[key] || '';

function pick(k) {
  const g = GLASOVI[k];
  state.sound = k;
  TARGET = g.letter;
  SYLLABLES = [...VOWELS].map((v) => [TARGET + v, v + TARGET + v, v + TARGET]);
  WORDS = g.words;
  SENTENCES = g.sentences || [];
  IMG = g.img;
  state.stage = 'syll';
  state.done = {};
  fresh();
  document.title = 'Глас ' + upper() + ' — вежби за изговор';
  $('letter').textContent = upper();
  $('sheet-letter').textContent = 'Глас ' + upper();

  // The owner's groups of words: named while there are few, numbers when many.
  const groups = Math.max(0, ...WORDS.map((w) => w.set || 0));
  const stages = [['syll', 'Слогови'], ['0', 'Сите зборови']];
  for (let n = 1; n <= groups; n++) stages.push([String(n), groups > 3 ? String(n) : 'Зборови ' + n, 'Зборови ' + n]);
  if (SENTENCES.length) stages.push(['sent', 'Реченици']);
  $('stage').textContent = '';
  for (const [v, text, name] of stages) {
    const b = document.createElement('button');
    b.dataset.v = v;
    b.textContent = text;
    if (name) b.setAttribute('aria-label', name);
    $('stage').appendChild(b);
  }
}

// A new list on screen: its own order, every card back at the common step.
function fresh() {
  state.order = list().map((_, i) => i);
  state.at = 0; state.own = {}; wipe();
}

// Everything the child has put in, for all cards or for one.
function wipe(i) {
  for (const k of ['filled', 'tiles', 'used', 'miss']) { if (i === undefined) state[k] = {}; else delete state[k][i]; }
  if (i === undefined || (state.sel && state.sel.i === i)) state.sel = null;
}

const stepOf = (i) => (i in state.own ? state.own[i] : state.step);

// Text as boxes: 0 whole, 1 without the target sound, 2 all empty, 3 no letters.
// The empty boxes of step 1 (the target sound) and of a word's step 2 (every
// letter) take a letter from the child; `filled` lists the positions already
// put back. A sentence breaks between words, and its step 2 hides the word in
// {braces} instead of emptying every box.
function letters(text, step, filled, sentence) {
  const box = document.createElement('div');
  box.className = 'word' + (sentence ? ' sent' : [...text].length > 6 ? ' long' : '') + (step === 3 ? ' hidden' : '');
  const group = () => {
    if (!sentence) return box;
    const g = document.createElement('span');
    g.className = 'grp';
    box.appendChild(g);
    return g;
  };
  let into = group(), braced = false, pos = -1;
  for (const ch of text) {
    if (ch === '{' || ch === '}') { braced = ch === '{'; continue; }
    pos++;
    const el = document.createElement('span');
    if (ch === ' ') {
      if (sentence) into = group(); else { el.className = 'dash'; el.textContent = ' '; into.appendChild(el); }
      continue;
    }
    if (sentence && step === 2 && braced) {
      if (!into.querySelector('.gap')) { el.className = 'gap'; into.appendChild(el); }
      continue;
    }
    if (!/\p{L}/u.test(ch)) { el.className = 'dash'; el.textContent = ch === '-' ? '–' : ch; into.appendChild(el); continue; }
    const isTarget = ch.toLowerCase() === TARGET;
    const open = (step === 1 && isTarget) || (step === 2 && !sentence);
    const got = open && filled.includes(pos);
    const empty = !got && (open || (step >= 2 && !sentence));
    el.className = 'ltr' + (isTarget ? ' t' : '') + (empty ? ' empty' : '') + (got ? ' got' : '');
    if (open && !got) { el.classList.add('drop'); el.dataset.pos = pos; }
    el.textContent = ch;
    into.appendChild(el);
  }
  return box;
}

function inline(text, step) {
  const frag = document.createDocumentFragment();
  for (const ch of text) {
    const isTarget = ch.toLowerCase() === TARGET;
    const s = document.createElement('span');
    s.textContent = (step >= 2 || (step === 1 && isTarget)) ? '_' : ch;
    if (isTarget) s.style.color = 'var(--target)';
    frag.appendChild(s);
  }
  return frag;
}

// How many boxes the child fills: the target sound in step 1, every letter of
// a word in step 2.
const holes = (text, step) => [...text].filter((ch) => (step === 1 ? ch.toLowerCase() === TARGET : step === 2 && !sentences() && /\p{L}/u.test(ch))).length;

// The empty box closest to the point, if the point is near one. A tile looks
// in its own card, a key of the keyboard in every card on screen.
function nearest(scope, x, y) {
  let best = null, bestD = Infinity;
  for (const b of scope.querySelectorAll('.drop')) {
    const r = b.getBoundingClientRect();
    const d = Math.hypot(x - (r.left + r.width / 2), y - (r.top + r.height / 2));
    if (d < bestD && d < r.height * 1.2) { best = b; bestD = d; }
  }
  return best;
}

// The box a tapped letter goes to: the one chosen by a tap, else the first
// empty one. With the keyboard there is one for the whole screen; with tiles
// each card that is being spelled shows its own.
function mark() {
  for (const b of out.querySelectorAll('.aim')) b.classList.remove('aim');
  const s = state.sel;
  const chosen = s && out.querySelector('.card[data-i="' + s.i + '"] .drop[data-pos="' + s.pos + '"]');
  if (chosen) chosen.classList.add('aim');
  for (const c of out.querySelectorAll(state.kb ? '.cards, .one' : '.card[data-step="2"]')) {
    const first = c.querySelector('.drop');
    if (first && !c.querySelector('.aim')) first.classList.add('aim');
  }
}

const aimed = (scope) => scope.querySelector('.drop.aim') || scope.querySelector('.drop');

// The right letter fills the box. A wrong one is counted, and after two the
// box shows its letter faintly.
function place(ch, box) {
  if (!box) return false;
  const i = Number(box.closest('.card').dataset.i), pos = Number(box.dataset.pos);
  const text = plain(list()[i]);
  if ([...text][pos].toLowerCase() !== ch) {
    const miss = state.miss[i] || (state.miss[i] = {});
    miss[pos] = (miss[pos] || 0) + 1;
    if (miss[pos] >= 2) box.classList.add('faint');
    return false;
  }
  const filled = state.filled[i] || (state.filled[i] = []);
  filled.push(pos);
  if (filled.length === holes(text, stepOf(i))) { state.flash = i; say(i, true); }
  // the next tap stays in this card: its first box still empty
  const rest = [...box.closest('.card').querySelectorAll('.drop')].find((b) => b !== box);
  state.sel = rest ? { i, pos: Number(rest.dataset.pos) } : null;
  return true;
}

// A tile or a key let go over a box, or tapped. `i` is the card of a tile (in
// step 2 the tile is used up), null for a key. Wrong goes back and shakes.
function drop(el, ch, i, box, wait) {
  if (place(ch, box)) {
    if (i !== null && stepOf(i) === 2) (state.used[i] || (state.used[i] = [])).push(Number(el.dataset.k));
    draw();
    return true;
  }
  setTimeout(() => { el.classList.remove('no'); void el.offsetWidth; el.classList.add('no'); }, wait);
  return false;
}

function goBack(tile) {
  tile.classList.remove('lift');
  tile.classList.add('back');
  tile.style.transform = '';
}

// Mouse, finger and pen alike. A tap or Enter places the letter without dragging.
function draggable(tile, ch, i) {
  const scope = () => (i === null ? out : tile.closest('.card'));
  let from = null, dragged = false;
  tile.addEventListener('pointerdown', (e) => {
    // a key takes no focus, so Space or Enter on the real keyboard cannot press it again
    if (i === null) e.preventDefault();
    from = { x: e.clientX, y: e.clientY };
    dragged = false;
    tile.classList.remove('back', 'no');
    tile.setPointerCapture(e.pointerId);
  });
  tile.addEventListener('pointermove', (e) => {
    if (!from) return;
    const dx = e.clientX - from.x, dy = e.clientY - from.y;
    if (!dragged && Math.hypot(dx, dy) < 8) return;
    dragged = true;
    tile.classList.add('lift');
    tile.style.transform = 'translate(' + dx + 'px, ' + dy + 'px) scale(1.1)';
  });
  tile.addEventListener('pointerup', () => {
    if (!from) return;
    from = null;
    if (!dragged) return;
    const r = tile.getBoundingClientRect();
    const box = nearest(scope(), r.left + r.width / 2, r.top + r.height / 2);
    if (!box || !drop(tile, ch, i, box, 200)) return goBack(tile);
    // a tile is redrawn with its card; a key stays where it is on the keyboard
    tile.classList.remove('lift');
    tile.style.transform = '';
  });
  tile.addEventListener('pointercancel', () => { from = null; goBack(tile); });
  tile.addEventListener('click', () => {
    if (dragged) { dragged = false; return; }
    drop(tile, ch, i, aimed(scope()), 0);
  });
}

// Step 1: the target letter and two wrong ones. Step 2: the word's own
// letters, shuffled, and two wrong ones; a tile put in a box is gone.
function tray(i, text, step, spent) {
  if (!state.tiles[i]) {
    const low = text.toLowerCase();
    const wrong = mix([...DISTRACTORS].filter((ch) => ch !== TARGET && !low.includes(ch))).slice(0, 2);
    const right = step === 1 ? [TARGET] : [...low].filter((ch) => /\p{L}/u.test(ch));
    state.tiles[i] = mix([...right, ...wrong]);
  }
  const used = state.used[i] || [];
  const box = document.createElement('div');
  box.className = 'tray' + (spent ? ' spent' : '');
  state.tiles[i].forEach((ch, k) => {
    const t = document.createElement('button');
    t.className = 'tile' + (used.includes(k) ? ' gone' : '');
    t.textContent = ch;
    t.dataset.k = k;
    t.setAttribute('aria-label', 'Буква ' + ch);
    draggable(t, ch, i);
    box.appendChild(t);
  });
  return box;
}

// Built once; shown by draw() while the keyboard is on and a box is empty.
function keyboard() {
  for (const row of KEYS) {
    const line = document.createElement('div');
    for (const ch of row) {
      const k = document.createElement('button');
      k.className = 'key';
      k.textContent = ch;
      k.dataset.ch = ch;
      k.setAttribute('aria-label', 'Буква ' + ch);
      draggable(k, ch, null);
      line.appendChild(k);
    }
    $('keys').appendChild(line);
  }
  const shut = document.createElement('button');
  shut.className = 'key shut';
  shut.textContent = '✕';
  shut.setAttribute('aria-label', 'Затвори ја тастатурата');
  shut.addEventListener('click', () => { state.kb = false; draw(); });
  $('keys').lastElementChild.appendChild(shut);
}

function tools(i, text) {
  const box = document.createElement('div');
  box.className = 'tools' + (state.edit ? ' edit' : '');
  const add = (label, name, run, cls) => {
    const b = document.createElement('button');
    b.className = 'plain' + (cls ? ' ' + cls : '');
    b.textContent = label;
    b.setAttribute('aria-label', name);
    b.addEventListener('click', run);
    box.appendChild(b);
  };
  add('🔊', 'Изговори', () => say(i));
  if (state.edit) {
    const keys = keysOf(list()[i]);
    keys.forEach((key, k) => add('🖼 Слика' + (keys.length > 1 ? ' ' + (k + 1) : ''), 'Смени ја сликата', () => openPicker(i, key)));
    add('📋 Копирај', 'Копирај ја картичката како слика', (e) => copyCard(e.currentTarget.closest('.card')));
    add('➜ Во таблата', 'Прати ја картичката во ComuniBoard', (e) => sendCard(e.currentTarget.closest('.card')));
    const live = rec && rec.i === i;
    add(live ? '⏹ Стоп' : (recs[text] ? '🎙 Сними пак' : '🎙 Сними'), live ? 'Запри го снимањето' : 'Сними', () => record(i), live ? 'live' : '');
    if (recs[text] && !live) add('🗑', 'Избриши ја снимката', () => { forget(text); draw(); });
  }
  return box;
}

function card(i) {
  const item = list()[i];
  const text = plain(item);
  const step = stepOf(i);
  const filled = state.filled[i] || [];
  const need = holes(text, step);
  const whole = need > 0 && filled.length === need;
  const el = document.createElement('div');
  el.className = 'card' + (state.flash === i ? ' pop' : '');
  el.dataset.i = i;
  el.dataset.step = step;
  if (state.flash === i) state.flash = -1;
  const pic = document.createElement('button');
  pic.className = 'pic';
  pic.setAttribute('aria-label', 'Слика ' + (state.order.indexOf(i) + 1) + (opensBig() ? ' — отвори ја голема' : ' — следен чекор'));
  const pics = document.createElement('span');
  pics.className = 'pics';
  for (const key of keysOf(item)) {
    const src = picture(key);
    const img = document.createElement(src ? 'img' : 'span');
    if (src) { img.src = src; img.alt = ''; } else { img.className = 'ph'; img.textContent = '🖼'; }
    pics.appendChild(img);
  }
  pic.append(pics, letters(item.w || item.s, step, filled, sentences()));
  const miss = state.miss[i] || {};
  for (const b of pic.querySelectorAll('.drop')) if (miss[b.dataset.pos] >= 2) b.classList.add('faint');
  // a tap on an empty box chooses it for the next letter; anywhere else is the
  // next step — or, among all the cards with the keyboard on, this card big
  pic.addEventListener('click', (e) => {
    const box = e.target.closest('.drop');
    if (box) { state.sel = { i, pos: Number(box.dataset.pos) }; mark(); return; }
    if (opensBig()) return zoom(i);
    state.own[i] = (step + 1) % 4;
    wipe(i);
    draw();
  });
  el.appendChild(pic);
  if (need && !state.kb) el.appendChild(tray(i, text, step, whole));
  el.appendChild(tools(i, text));
  if (whole) {
    const star = document.createElement('span');
    star.className = 'star';
    star.textContent = '⭐';
    star.setAttribute('aria-hidden', 'true');
    el.appendChild(star);
  }
  return el;
}

// With the keyboard on, one keyboard serves every card of „Сите заедно", and
// the cards are small beside it: a tap on a picture opens that card big. It is
// a step in the browser's history, so Back returns to all of them.
const opensBig = () => state.kb && state.view === 'grid';

function zoom(i) {
  state.view = 'one';
  state.at = Math.max(0, shown().indexOf(i));
  state.zoomed = true;
  history.pushState({ zoom: true }, '');
  draw();
}

function mix(o) {
  for (let i = o.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [o[i], o[j]] = [o[j], o[i]]; }
  return o;
}

// ---------- kept on this device ----------
// Two IndexedDB stores, both keyed by the text: `voice` (the therapist's
// recordings) and `pics` (pictures chosen here, as data URIs). Nothing leaves
// the device unless the owner exports a sound.
const recs = {};
const own = {};
let rec = null;
let db = null;

function note(text) { $('note').textContent = text; }

function openDb() {
  return new Promise((done) => {
    try {
      const r = indexedDB.open('artikulacija', 2);
      r.onupgradeneeded = () => {
        for (const name of ['voice', 'pics']) if (!r.result.objectStoreNames.contains(name)) r.result.createObjectStore(name);
      };
      r.onerror = () => done();
      r.onsuccess = () => {
        db = r.result;
        let left = 2;
        const load = (name, into) => {
          const c = db.transaction(name).objectStore(name).openCursor();
          const end = () => { if (--left === 0) done(); };
          c.onerror = end;
          c.onsuccess = () => {
            if (!c.result) return end();
            into[c.result.key] = c.result.value;
            c.result.continue();
          };
        };
        load('voice', recs);
        load('pics', own);
      };
    } catch (e) { done(); }
  });
}

function store(name, key, value) {
  try {
    if (!db) return;
    const s = db.transaction(name, 'readwrite').objectStore(name);
    if (value === undefined) s.delete(key); else s.put(value, key);
  } catch (e) {}
}

function keep(text, blob) { recs[text] = blob; store('voice', text, blob); }
function forget(text) { delete recs[text]; store('voice', text); }

// ---------- pictures ----------
// ARASAAC search, Macedonian first and then English, as in WBACC. Searching
// needs the internet; the chosen picture is kept as data, so it shows offline.
const ARASAAC = 'https://api.arasaac.org/api/pictograms/';
const pictogram = (id, size) => 'https://static.arasaac.org/pictograms/' + id + '/' + id + '_' + size + '.png';
let picking = null;

function openPicker(i, key) {
  const item = list()[i];
  const braced = /\{([^}]+)\}/.exec(item.s || '');
  picking = key;
  $('pk-title').textContent = 'Слика за „' + plain(item) + '"';
  $('pk-q').value = (item.w || (braced ? braced[1] : plain(item))).toLowerCase();
  $('pk-none').style.display = own[key] ? '' : 'none';
  $('pk-out').textContent = '';
  $('picker').showModal();
  find();
}

async function ask(locale, word) {
  const r = await fetch(ARASAAC + locale + '/search/' + encodeURIComponent(word));
  return r.ok ? r.json() : [];
}

async function find() {
  const word = $('pk-q').value.trim();
  if (!word) return;
  $('pk-msg').textContent = 'Пребарувам…';
  $('pk-out').textContent = '';
  let found;
  try {
    found = await ask('mk', word);
    if (!found.length) found = await ask('en', word);
  } catch (e) {
    $('pk-msg').textContent = 'Нема врска со интернет. Пребарувањето на пиктограми бара интернет; избраната слика потоа работи и без него.';
    return;
  }
  if (word !== $('pk-q').value.trim()) return;
  $('pk-msg').textContent = found.length
    ? 'Допри ја сликата што одговара. За друга слика, напиши друг збор (може и на англиски).'
    : 'Нема пиктограм за „' + word + '". Пробај со друг збор или на англиски.';
  for (const p of found.slice(0, 24)) {
    const b = document.createElement('button');
    b.setAttribute('aria-label', 'Избери ја оваа слика');
    const img = document.createElement('img');
    img.src = pictogram(p._id, 300);
    img.alt = '';
    img.loading = 'lazy';
    b.appendChild(img);
    b.addEventListener('click', () => choose(p._id));
    $('pk-out').appendChild(b);
  }
}

async function choose(id) {
  $('pk-msg').textContent = 'Ја земам сликата…';
  try {
    const blob = await (await fetch(pictogram(id, 500))).blob();
    const uri = await new Promise((done, fail) => {
      const r = new FileReader();
      r.onload = () => done(r.result);
      r.onerror = fail;
      r.readAsDataURL(blob);
    });
    own[picking] = uri;
    store('pics', picking, uri);
    $('picker').close();
    draw();
  } catch (e) {
    $('pk-msg').textContent = 'Сликата не се презеде. Провери ја врската и пробај пак.';
  }
}

// ---------- the card as a picture ----------
// Drawn from what is on screen, so it is the card in the step it is in now:
// the pictures and the letter boxes, without the tiles and the buttons.
async function cardCanvas(cardEl) {
  const pic = cardEl.querySelector('.pic');
  // a picture put on screen a moment ago may not be loaded yet
  await Promise.all([...pic.querySelectorAll('img')].map((im) => im.complete || new Promise((done) => { im.onload = im.onerror = done; })));
  const area = pic.getBoundingClientRect();
  const pad = 14, scale = 2;
  const canvas = document.createElement('canvas');
  canvas.width = Math.round((area.width + 2 * pad) * scale);
  canvas.height = Math.round((area.height + 2 * pad) * scale);
  const g = canvas.getContext('2d');
  g.scale(scale, scale);
  g.fillStyle = '#ffffff';
  g.fillRect(0, 0, area.width + 2 * pad, area.height + 2 * pad);
  const at = (el) => {
    const r = el.getBoundingClientRect();
    return { x: r.left - area.left + pad, y: r.top - area.top + pad, w: r.width, h: r.height };
  };
  const box = (r, radius) => {
    g.beginPath();
    if (g.roundRect) g.roundRect(r.x, r.y, r.w, r.h, radius); else g.rect(r.x, r.y, r.w, r.h);
  };
  const write = (el, r) => {
    const st = getComputedStyle(el);
    g.font = st.fontWeight + ' ' + st.fontSize + ' ' + st.fontFamily;
    g.fillStyle = st.color;
    g.textAlign = 'center';
    g.textBaseline = 'middle';
    g.fillText(el.textContent, r.x + r.w / 2, r.y + r.h / 2 + 1);
  };

  for (const el of pic.querySelectorAll('.pics > *')) {
    const r = at(el);
    if (el.tagName === 'IMG') {
      const k = Math.min(r.w / el.naturalWidth, r.h / el.naturalHeight) || 0;
      const w = el.naturalWidth * k, h = el.naturalHeight * k;
      if (k) g.drawImage(el, r.x + (r.w - w) / 2, r.y + (r.h - h) / 2, w, h);
    } else {
      g.setLineDash([8, 6]);
      g.lineWidth = 2;
      g.strokeStyle = getComputedStyle(el).borderTopColor;
      box({ x: r.x + 1, y: r.y + 1, w: r.w - 2, h: r.h - 2 }, 16);
      g.stroke();
      g.setLineDash([]);
    }
  }
  const word = pic.querySelector('.word');
  if (word.classList.contains('hidden')) return canvas;
  for (const el of word.querySelectorAll('.ltr, .dash, .gap')) {
    const r = at(el);
    const st = getComputedStyle(el);
    if (el.classList.contains('gap')) {
      g.fillStyle = st.borderBottomColor;
      g.fillRect(r.x, r.y + r.h - 3, r.w, 3);
    } else if (el.classList.contains('dash')) {
      write(el, r);
    } else {
      box({ x: r.x + 1, y: r.y + 1, w: r.w - 2, h: r.h - 2 }, 9);
      g.fillStyle = st.backgroundColor;
      g.fill();
      g.lineWidth = 2;
      g.strokeStyle = st.borderTopColor;
      g.stroke();
      if (!el.classList.contains('empty')) write(el, r);
    }
  }
  return canvas;
}

// To the clipboard, for Ctrl+V into Word or a chat. Where the browser will not
// allow that, the same picture is saved as a file instead.
async function copyCard(cardEl) {
  const blob = cardCanvas(cardEl).then((canvas) => new Promise((done) => canvas.toBlob(done, 'image/png')));
  try {
    await navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]);
    note('Картичката е копирана како слика. Залепи ја со Ctrl+V.');
  } catch (e) {
    const url = URL.createObjectURL(await blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'karticka.png';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
    note('Прелистувачот не дозволи копирање, па картичката е зачувана како слика (karticka.png).');
  }
}

// ---------- the parts of the page ----------
// The exercises, and the owner's two other tools, each in a frame from the
// folder above (MTB's own ComuniBoard.html and WBACC.html, one copy of each),
// loaded the first time it is opened. The start is a board of tiles, as MTB's
// Контролна табла; index.html#vezbi (or #tabla, #crtanje) opens one directly.
const APPS = [
  { key: 'vezbi', tab: 'Вежби', glyph: '🗣', color: '#2f6fe4', title: 'Вежби за изговор',
    text: '26 гласови: слогови, зборови со слики и реченици. Помошта се намалува чекор по чекор, а буквите се влечат во кутиите.',
    when: 'На час, со дете.' },
  { key: 'tabla', tab: 'ComuniBoard', src: '../ComuniBoard.html', glyph: '🧩', color: '#1e9e8b', title: 'ComuniBoard — табла',
    text: 'Картички и кирилична табла: слободно место за букви, слики и линии. Картичка од вежбите доаѓа тука со „➜ Во таблата" (во „✏️ Уреди").',
    when: 'Кога сама составуваш вежба.' },
  { key: 'crtanje', tab: 'WBACC Studio', src: '../WBACC.html', glyph: '✏️', color: '#6b4fd8', title: 'WBACC Studio — цртање',
    text: 'Бела табла за цртање и пишување со рака, со пиктограми (Excalidraw). Картичка се лепи со „📋 Копирај" па Ctrl+V.',
    when: 'За слободно цртање и за презентација.' },
];

function go(app) {
  if (!APPS.some((a) => a.key === app)) app = 'home';
  state.app = app;
  if (app !== 'vezbi') state.focus = false;
  document.body.classList.remove('bare');
  for (const b of $('apps').children) {
    if (b.dataset.v) b.setAttribute('aria-pressed', String(b.dataset.v === app));
    else if (b.dataset.of) b.hidden = b.dataset.of !== app || !b.children.length;
  }
  $('home').hidden = app !== 'home';
  $('vezbi').hidden = app !== 'vezbi';
  for (const a of APPS) {
    if (!a.src) continue;
    $(a.key).hidden = a.key !== app;
    if (a.key === app && !$(a.key).getAttribute('src')) $(a.key).src = a.src;
  }
  document.body.classList.toggle('framed', APPS.some((a) => a.key === app && a.src));
  if (GLASOVI.length) draw();
}

// Through the address, so the browser's Back returns to the tiles.
function openApp(app) {
  if (location.hash.slice(1) === app) go(app); else location.hash = app;
}

function parts() {
  const tab = (key, text, name) => {
    const b = document.createElement('button');
    b.dataset.v = key;
    b.textContent = text;
    if (name) { b.setAttribute('aria-label', name); b.title = name; }
    b.addEventListener('click', () => openApp(key));
    $('apps').appendChild(b);
  };
  tab('home', '🏠', 'Контролна табла');
  for (const a of APPS) {
    tab(a.key, a.tab);
    const el = document.createElement('button');
    el.className = 'app';
    el.style.setProperty('--c', a.color);
    const img = document.createElement('img');
    img.src = a.key + '.jpg';
    img.alt = '';
    img.onerror = () => img.remove();
    const head = document.createElement('span');
    head.className = 'app-head';
    for (const [cls, text] of [['chip', a.glyph], ['app-name', a.title]]) {
      const s = document.createElement('span');
      s.className = cls;
      s.textContent = text;
      head.appendChild(s);
    }
    el.append(img, head);
    for (const [cls, text] of [['app-text', a.text], ['app-when', a.when]]) {
      const s = document.createElement('span');
      s.className = cls;
      s.textContent = text;
      el.appendChild(s);
    }
    el.addEventListener('click', () => openApp(a.key));
    $('tiles').appendChild(el);
    if (!a.src) continue;
    // The tool's own tabs come to this strip (see `hosted`); its place is kept
    // after the tool's tab, empty until the tool answers.
    const sub = document.createElement('span');
    sub.className = 'sub';
    sub.dataset.of = a.key;
    sub.hidden = true;
    $('apps').appendChild(sub);
    $(a.key).addEventListener('load', () => {
      $(a.key).dataset.ready = '1';
      $(a.key).contentWindow.postMessage({ type: 'mtb-host' }, '*');
    });
  }
  window.addEventListener('hashchange', () => go(location.hash.slice(1)));
  window.addEventListener('message', hosted);
  diary();
}

// „📓 S-Дневник" at the end of the strip: the way to the records, shown only
// where the diary really lives — a page served by an MTB server that answers
// (the cloud, the local server). On GitHub Pages and from the disk there is no
// link: the S-Dnevnik.html that sits there is a separate, empty copy that
// looks real (CLAUDE.md, „Which address people open"). This page still holds
// nothing of the records; it asks only „is there a server".
//
// Opened from the diary's own „🗣 Вежби ↗" this tab has an opener: the link
// then closes the tab, which returns to that diary as it was left, instead of
// opening a second copy of it.
//
// From the disk the diary is somewhere else: in the cloud, whose address is
// not written in this repository. The Контролна табла knows it (server\.env)
// and hands it over when it opens this page (`?oblak=https://…`); the browser
// keeps it for a double-click later. It is taken from a page on the disk only:
// on a public address anyone could hand in an address of their own, under a
// link that says „S-Дневник".
function diaryFromDisk() {
  if (location.protocol !== 'file:') return '';
  const KEY = 'vezbi_oblak_v1';
  const origin = (v) => { try { const u = new URL(v); return u.protocol === 'https:' ? u.origin : ''; } catch (e) { return ''; } };
  const given = origin(new URLSearchParams(location.search).get('oblak') || '');
  try {
    if (given) localStorage.setItem(KEY, given);
    return given || origin(localStorage.getItem(KEY) || '');
  } catch (e) { return given; }
}

function diary() {
  if (!/^https?:$/.test(location.protocol)) {
    const cloud = diaryFromDisk();
    if (!cloud) return;
    const a = document.createElement('a');
    a.className = 'diary';
    a.textContent = '📓 S-Дневник';
    a.href = cloud + '/MTB-Workspace.html?app=S-Dnevnik.html';
    a.title = 'Отвори го S-Дневник во облакот (' + new URL(cloud).host + ')';
    $('apps').appendChild(a);
    return;
  }
  fetch('../api/health', { cache: 'no-store' })
    .then((r) => (r.ok ? r.json() : null))
    .then((body) => {
      if (!body || body.ok !== true) return;
      const a = document.createElement('a');
      a.className = 'diary';
      a.textContent = '📓 S-Дневник';
      // in the cloud the diary is a window of the work space
      a.href = body.cloudAuth === 'google' ? '../MTB-Workspace.html?app=S-Dnevnik.html' : '../S-Dnevnik.html';
      const fromDiary = () => {
        try { return Boolean(window.opener) && !window.opener.closed && /S-Dnevnik\.html$/.test(window.opener.location.pathname); }
        catch (e) { return false; }
      };
      a.title = fromDiary() ? 'Назад во S-Дневник (ова јазиче се затвора)' : 'Отвори го S-Дневник';
      a.addEventListener('click', (e) => {
        if (!fromDiary()) return;
        e.preventDefault();
        window.close();
        // a browser that will not close the tab still goes to the diary
        setTimeout(() => { location.href = a.href; }, 300);
      });
      $('apps').appendChild(a);
    })
    .catch(() => { /* no server here: no diary here */ });
}

// A tool in a frame that has tabs of its own (ComuniBoard: „Картички",
// „Кирилична Табла") is told at load that this page will show them. It takes
// its own row away and answers with the tabs and the open one; a tap here
// sends the choice back. It may also ask for the whole window („само табла"),
// and then this strip goes too until the tool gives it back.
function hosted(e) {
  const a = APPS.find((x) => x.src && $(x.key).contentWindow === e.source);
  const data = e.data || {};
  if (!a) return;
  if (data.type === 'mtb-chrome') {
    document.body.classList.toggle('bare', Boolean(data.hidden) && state.app === a.key);
    return;
  }
  if (data.type !== 'mtb-tabs' || !Array.isArray(data.tabs)) return;
  const sub = $('apps').querySelector('.sub[data-of="' + a.key + '"]');
  sub.textContent = '';
  for (const t of data.tabs.slice(0, 6)) {
    const b = document.createElement('button');
    b.textContent = String(t.label || '').slice(0, 40);
    b.setAttribute('aria-pressed', String(t.target === data.active));
    b.addEventListener('click', () => e.source.postMessage({ type: 'mtb-tab', target: t.target }, '*'));
    sub.appendChild(b);
  }
  sub.hidden = state.app !== a.key || !sub.children.length;
}

// The card as a picture, handed to ComuniBoard in its frame, which puts it on
// its board (the receiver is in ../ComuniBoard.html). The card is drawn
// first, while it is still on screen.
async function sendCard(cardEl) {
  const url = (await cardCanvas(cardEl)).toDataURL('image/png');
  const frame = $('tabla');
  const ready = frame.dataset.ready ? Promise.resolve() : new Promise((done) => frame.addEventListener('load', done, { once: true }));
  openApp('tabla');
  await ready;
  frame.contentWindow.postMessage({ type: 'insert-generated-image', url }, '*');
}

// The sound as a file for the glasovi folder, with the pictures chosen here inside.
function exportSound() {
  const g = GLASOVI[state.sound];
  const img = Object.assign({}, g.img);
  for (const item of [...g.words, ...(g.sentences || [])]) {
    for (const key of keysOf(item)) if (own[key]) img[key] = own[key];
  }
  const body = { letter: g.letter, file: g.file, words: g.words, sentences: g.sentences || [], img };
  const text = '// Глас ' + upper() + '. Exported from the page with the pictures chosen there.\n'
    + 'GLASOVI.push(' + JSON.stringify(body, null, 1) + ');\n';
  const url = URL.createObjectURL(new Blob([text], { type: 'text/javascript' }));
  const a = document.createElement('a');
  a.href = url;
  a.download = g.file + '.js';
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
  note('Зачуван е фајлот ' + g.file + '.js. Стави го во папката „glasovi" наместо стариот и сликите ќе важат на секој уред.');
}

function pickVoice() {
  const voices = window.speechSynthesis ? speechSynthesis.getVoices() : [];
  return voices.find((v) => /^mk/i.test(v.lang)) || voices.find((v) => /^(sr|bg|hr|sl|ru)/i.test(v.lang)) || null;
}
if (window.speechSynthesis) { speechSynthesis.getVoices(); speechSynthesis.onvoiceschanged = () => {}; }

// `quiet`: said by the page itself after a right answer, so no message if it cannot.
function say(i, quiet) {
  const text = plain(list()[i]);
  if (recs[text]) {
    const url = URL.createObjectURL(recs[text]);
    const a = new Audio(url);
    a.onended = () => URL.revokeObjectURL(url);
    a.play().catch(() => {});
    return;
  }
  const voice = pickVoice();
  if (!voice) {
    if (!quiet) note('Овој уред нема македонски глас. Вклучи „✏️ Уреди" и сними еднаш — потоа ќе се слуша твојот глас.');
    return;
  }
  const u = new SpeechSynthesisUtterance(text.replace(/-/g, ' '));
  u.voice = voice; u.lang = voice.lang; u.rate = 0.8;
  speechSynthesis.cancel();
  speechSynthesis.speak(u);
}

async function record(i) {
  if (rec) { if (rec.recorder.state !== 'inactive') rec.recorder.stop(); return; }
  note('');
  const text = plain(list()[i]);
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    const recorder = new MediaRecorder(stream);
    const parts = [];
    recorder.ondataavailable = (e) => parts.push(e.data);
    recorder.onstop = () => {
      clearTimeout(rec.timer);
      rec = null;
      stream.getTracks().forEach((t) => t.stop());
      keep(text, new Blob(parts, { type: recorder.mimeType }));
      draw();
      if (plain(list()[i] || {w: ''}) === text) say(i);
    };
    rec = { i, recorder, timer: setTimeout(() => { if (recorder.state !== 'inactive') recorder.stop(); }, 5000) };
    recorder.start();
    draw();
  } catch (e) {
    note('Микрофонот не е достапен. Дозволи го во прелистувачот и пробај пак.');
  }
}

function shown() {
  const set = Number(state.stage);
  return state.order.filter((i) => !set || WORDS[i].set === set);
}

function draw() {
  for (const id of ['sound', 'stage', 'step', 'view']) {
    for (const b of $(id).children) b.setAttribute('aria-pressed', String(b.dataset.v === String(state[id])));
  }
  const names = sentences()
    ? ['Цела реченица', 'Без ' + upper(), 'Без збор', 'Само слика']
    : ['Цел збор', 'Без ' + upper(), 'Само цртички', 'Само слика'];
  [...$('step').children].forEach((b, k) => { b.textContent = names[k]; });
  const words = state.stage !== 'syll';
  // kept in the row while out of use, so the bar does not fold as the words come on
  $('view').parentElement.style.visibility = words ? '' : 'hidden';
  $('step').lastElementChild.style.display = words ? '' : 'none';
  $('edit').setAttribute('aria-pressed', String(state.edit));
  $('kb').setAttribute('aria-pressed', String(state.kb));
  $('tips').setAttribute('aria-pressed', String(state.tips));
  $('export').style.display = state.edit ? '' : 'none';
  // what a closed menu says: the choice made in it; ⋯ is lit while „Уреди" is on
  const at = $('stage').querySelector('[aria-pressed="true"]');
  $('stage-now').textContent = at ? at.getAttribute('aria-label') || at.textContent : '';
  $('step-now').textContent = names[words ? state.step : Math.min(state.step, 2)];
  $('more').classList.toggle('on', state.edit);
  $('hint').hidden = !state.tips;
  const fit = state.app === 'vezbi' && words && state.view === 'one';
  document.body.classList.toggle('fit', fit);
  document.body.classList.toggle('focus', state.focus && state.app === 'vezbi');
  $('unfocus').hidden = !(state.focus && state.app === 'vezbi');
  fitBar();
  out.textContent = '';
  cards(words, names);

  // the keyboard only while there is a box to fill; the page ends above it
  $('keys').hidden = !(state.app === 'vezbi' && words && state.kb && out.querySelector('.drop'));
  document.body.style.paddingBottom = $('keys').hidden ? '' : $('keys').offsetHeight + (fit ? 14 : 24) + 'px';
  mark();
  // among all the cards the chosen box may lie under the keyboard; one card fits above it
  const box = !fit && !$('keys').hidden && out.querySelector('.aim');
  if (box) {
    const under = box.getBoundingClientRect().bottom + 12 - $('keys').getBoundingClientRect().top;
    if (under > 0) window.scrollBy(0, under);
  }
}

// As much of the bar in its one row as the row holds. What does not fit goes
// away in this order: the groups into a menu, the words of the buttons, the
// steps into a menu; a phone gets a second row.
function fitBar() {
  const bar = $('bar');
  for (let tight = 0; tight <= 4; tight++) {
    bar.dataset.tight = tight;
    $('m-stage').classList.toggle('inline', tight < 1);
    $('m-step').classList.toggle('inline', tight < 3);
    if (bar.scrollWidth <= bar.clientWidth) break;
  }
}

function shut() {
  for (const m of document.querySelectorAll('.menu.open')) {
    m.classList.remove('open');
    m.querySelector('.opener').setAttribute('aria-expanded', 'false');
  }
}

function menus() {
  for (const m of document.querySelectorAll('.menu')) {
    const opener = m.querySelector('.opener'), pop = m.querySelector('.pop');
    opener.addEventListener('click', () => {
      const was = m.classList.contains('open');
      shut();
      if (was) return;
      m.classList.add('open');
      opener.setAttribute('aria-expanded', 'true');
      // kept inside the window, whichever end of the bar it hangs from
      pop.style.transform = '';
      const r = pop.getBoundingClientRect();
      const by = Math.max(8 - r.left, Math.min(0, window.innerWidth - 8 - r.right));
      if (by) pop.style.transform = 'translateX(' + by + 'px)';
    });
    // a choice closes its menu
    pop.addEventListener('click', (e) => { if (e.target.closest('button')) shut(); });
  }
  document.addEventListener('pointerdown', (e) => { if (!e.target.closest('.menu')) shut(); });
  window.addEventListener('resize', () => { if (state.app !== 'vezbi') return; shut(); fitBar(); });
}

// Only the cards: the strip of parts and the bar give their rows to the
// picture. The browser's own full screen is asked for and is not needed.
function cardsOnly(on) {
  state.focus = on;
  try {
    if (on && document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(() => {});
    else if (!on && document.fullscreenElement) document.exitFullscreen();
  } catch (e) {}
  draw();
}

function cards(words, names) {
  if (!words) {
    $('hint').textContent = 'Допри го слогот кога ќе се изговори добро. Редот оди: почеток – средина – крај.';
    const grid = document.createElement('div');
    grid.className = 'syll';
    SYLLABLES.flat().forEach((s) => {
      const b = document.createElement('button');
      b.className = state.done[s] ? 'done' : '';
      b.appendChild(inline(s, Math.min(state.step, 2)));
      b.addEventListener('click', () => { state.done[s] = !state.done[s]; draw(); });
      grid.appendChild(b);
    });
    out.appendChild(grid);
    return;
  }

  const from = state.kb ? 'од тастатурата' : 'од плочките';
  const tap = opensBig() ? 'Допри ја сликата за да ја отвориш картичката голема.' : 'Допри ја сликата за следниот чекор.';
  $('hint').textContent = state.step === 1
    ? 'Повлечи ја буквата што недостига ' + from + ' во празната кутија. 🔊 го кажува текстот. ' + tap
    : state.step === 2 && !sentences()
    ? 'Состави го зборот: повлечи ги буквите ' + from + ' во кутиите, или допри кутија па буква. По две грешки буквата се покажува бледо. ' + tap
    : opensBig() ? tap + ' 🔊 го кажува текстот.'
    : 'Допри ја сликата за следниот чекор само за неа: ' + names.join(' → ').toLowerCase().replace(' ' + TARGET + ' ', ' ' + upper() + ' ') + '. 🔊 го кажува текстот.';
  const now = shown();
  if (state.view === 'grid') {
    const grid = document.createElement('div');
    grid.className = 'cards' + (sentences() ? ' wide' : '');
    now.forEach((i) => grid.appendChild(card(i)));
    out.appendChild(grid);
    return;
  }
  state.at = Math.min(state.at, now.length - 1);
  const one = document.createElement('div');
  one.className = 'one';
  const nav = (text, by, name) => {
    const b = document.createElement('button');
    b.className = 'nav ' + (by < 0 ? 'prev' : 'next'); b.textContent = text; b.setAttribute('aria-label', name);
    b.disabled = now.length < 2;
    b.addEventListener('click', () => move(by));
    return b;
  };
  one.append(nav('‹', -1, 'Претходна'), card(now[state.at]), nav('›', 1, 'Следна'));
  const count = document.createElement('div');
  count.className = 'count';
  if (state.zoomed) {
    const back = document.createElement('button');
    back.className = 'plain';
    back.textContent = '← Сите заедно';
    back.addEventListener('click', () => history.back());
    count.appendChild(back);
  }
  count.append((state.at + 1) + ' од ' + now.length);
  one.appendChild(count);
  out.appendChild(one);
}

function move(by) {
  const n = shown().length;
  state.at = (state.at + by + n) % n;
  draw();
}

// Leaving the syllables for the words keeps the word order; words <-> sentences is a new list.
function stage(v) {
  const was = sentences();
  state.stage = v;
  state.at = 0;
  if (was !== sentences()) fresh();
}

// the button's value, wherever in the button the tap fell (a picture, a word)
const chosen = (e) => { const b = e.target.closest('button'); return b ? b.dataset.v : undefined; };
$('sound').addEventListener('click', (e) => { const v = chosen(e); if (v === undefined) return; note(''); pick(Number(v)); draw(); });
$('stage').addEventListener('click', (e) => { const v = chosen(e); if (v === undefined) return; stage(v); note(''); draw(); });
$('step').addEventListener('click', (e) => { const v = chosen(e); if (v === undefined) return; state.step = Number(v); state.own = {}; wipe(); draw(); });
$('view').addEventListener('click', (e) => {
  const v = chosen(e);
  if (v === undefined) return;
  // back from a card opened big is the same step back as the browser's
  if (state.zoomed && v === 'grid') return history.back();
  state.view = v;
  draw();
});
window.addEventListener('popstate', (e) => {
  const zoomed = Boolean(e.state && e.state.zoom);
  if (zoomed === state.zoomed) return;
  state.zoomed = zoomed;
  state.view = zoomed ? 'one' : 'grid';
  draw();
});
$('tips').addEventListener('click', () => { state.tips = !state.tips; draw(); });
$('full').addEventListener('click', () => cardsOnly(true));
$('unfocus').addEventListener('click', () => cardsOnly(false));
document.addEventListener('fullscreenchange', () => { if (!document.fullscreenElement && state.focus) cardsOnly(false); });
$('shuffle').addEventListener('click', () => {
  if (state.stage === 'syll') stage('0');
  mix(state.order);
  state.at = 0;
  draw();
});
$('edit').addEventListener('click', () => {
  state.edit = !state.edit;
  note(state.edit ? 'Сликите и снимките се чуваат само на овој уред. „⬇ Извези" го дава фајлот на гласот со сликите, за папката „glasovi".' : '');
  draw();
});
$('kb').addEventListener('click', () => { state.kb = !state.kb; state.sel = null; draw(); });
$('export').addEventListener('click', exportSound);
$('pk-close').addEventListener('click', () => $('picker').close());
$('pk-go').addEventListener('click', find);
$('pk-q').addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); find(); } });
$('pk-none').addEventListener('click', () => { delete own[picking]; store('pics', picking); $('picker').close(); draw(); });
$('print').addEventListener('click', () => {
  if (state.stage === 'syll') stage('0');
  state.view = 'grid';
  draw();
  window.print();
});
document.addEventListener('keydown', (e) => {
  if (state.app !== 'vezbi') return;
  if (e.key === 'Escape') {
    if (document.querySelector('.menu.open')) return shut();
    if (state.focus) return cardsOnly(false);
  }
  // with the keyboard on screen, the same letter typed on the real one presses its key
  if (!$('keys').hidden && !$('picker').open && !e.ctrlKey && !e.altKey && !e.metaKey) {
    const key = [...$('keys').querySelectorAll('[data-ch]')].find((k) => k.dataset.ch === e.key.toLowerCase());
    if (key) { e.preventDefault(); key.click(); return; }
  }
  if (state.stage === 'syll' || state.view !== 'one') return;
  if (e.key === 'ArrowRight') move(1);
  else if (e.key === 'ArrowLeft') move(-1);
  else if (e.key === ' ' && e.target === document.body) { e.preventDefault(); out.querySelector('.pic').click(); }
});

parts();
menus();
if (!GLASOVI.length) {
  $('hint').textContent = 'Недостига папката „glasovi". Копирај ја заедно со index.html, во иста папка.';
  go(location.hash.slice(1));
} else {
  GLASOVI.forEach((g, k) => {
    const b = document.createElement('button');
    b.dataset.v = k;
    b.textContent = g.letter.toUpperCase();
    b.setAttribute('aria-label', 'Глас ' + g.letter.toUpperCase());
    $('sound').appendChild(b);
  });
  keyboard();
  pick(0);
  go(location.hash.slice(1));
  openDb().then(draw);
}
</script>
</body>
</html>
