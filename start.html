<!DOCTYPE html>
<html lang="mk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Сите апликации — MTB</title>
<script src="mtb-theme.js"></script>
<link rel="stylesheet" href="mtb-look.css">
<style>
  /* Palette, header and font are the suite's one look (mtb-look.css, taken
     from S-Dnevnik). --ok stays green: it means "this machine answers". */
  :root{
    --ink:var(--text); --line:var(--border); --dim:#8a99a6;
    --ok:#0e6b58; --ok-bg:#dcebe6; --warn:#a2570b; --warn-bg:#f8eddb;
  }
  :root[data-theme="dark"] {
    --ok:#46c2a5; --ok-bg:#16302b; --warn:#e4a34b; --warn-bg:#2b2418; --dim:#7c8b98;
  }
  body{font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
  header{justify-content:space-between}
  .wrap{max-width:560px;margin:0 auto;padding:24px 16px 56px;display:flex;flex-direction:column;gap:18px}
  .sub{color:var(--muted);font-size:.92rem;margin:0}
  .card{background:var(--card);border:2px solid var(--line);border-radius:8px;padding:16px}
  .status{display:flex;align-items:center;gap:10px;font-size:.95rem}
  .dot{width:10px;height:10px;border-radius:50%;background:var(--dim);flex:none}
  .dot.live{background:var(--ok)}
  .dot.spin{animation:pulse 1s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:.25}50%{opacity:1}}
  @media (prefers-reduced-motion:reduce){.dot.spin{animation:none;opacity:.6}}
  .machine{font-family:ui-monospace,"Cascadia Mono",Consolas,monospace;font-size:.9rem}
  a.app{
    display:flex;flex-direction:column;gap:2px;text-decoration:none;color:inherit;
    border:2px solid var(--line);border-radius:8px;padding:13px 15px;background:var(--card);
  }
  a.app:hover,a.app:focus-visible{border-color:var(--primary);outline:none}
  a.app .n{font-weight:600}
  a.app .d{font-size:.85rem;color:var(--muted)}
  .apps{display:flex;flex-direction:column;gap:8px}
  details.tools{border-top:1px solid var(--line);padding-top:12px}
  details.tools summary{cursor:pointer;color:var(--muted);font-size:.9rem}
  details.tools .apps{margin-top:10px}
  .note{border-left:3px solid var(--warn);background:var(--warn-bg);padding:13px 15px;border-radius:6px;font-size:.9rem}
  .note.ok{border-left-color:var(--ok);background:var(--ok-bg)}
  .tried{font-family:ui-monospace,Consolas,monospace;font-size:.8rem;color:var(--muted);
         white-space:pre-wrap;word-break:break-all;margin-top:6px}
  button.link{background:none;border:none;color:var(--btn-bg);font:inherit;font-size:.88rem;
              padding:0;cursor:pointer;text-decoration:underline;align-self:flex-start}
  textarea{width:100%;font-family:ui-monospace,Consolas,monospace;font-size:.85rem;
           background:var(--bg);color:var(--ink);border:1px solid var(--line);
           border-radius:6px;padding:10px;min-height:76px}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  button.go{background:var(--btn-bg);color:#fff;border:none;border-radius:6px;
            padding:12px 25px;font:inherit;font-size:14px;font-weight:600;cursor:pointer}
  .hide{display:none}
  .theme{width:34px;height:34px;border:1px solid rgba(255,255,255,.35);
         border-radius:8px;background:rgba(0,0,0,.2);color:#fff;font-size:16px;cursor:pointer}
  .theme:hover,.theme:focus-visible{background:rgba(0,0,0,.32);outline:none}
  :root[data-theme="dark"] button.link{color:#a3b0f7}
</style>
</head>
<body>
<header>
  <h1>🚪 Отвори ја апликацијата</h1>
  <button type="button" class="theme" id="theme" hidden></button>
</header>
<div class="wrap">
  <p class="sub">Барам кој компјутер е вклучен, па те носам таму. Обележи ја <b>оваа</b> страница — не самите апликации.</p>

  <div class="card">
    <div class="status"><span class="dot spin" id="dot"></span><span id="msg">Барам сервер…</span></div>
    <div class="tried" id="tried"></div>
  </div>

  <div class="apps hide" id="apps"></div>

  <details class="tools hide" id="tools">
    <summary>Поставување, проверка и резервни алатки</summary>
    <div class="apps" id="toolApps"></div>
  </details>

  <div id="extra"></div>

  <button class="link" id="editBtn">Измени адреси на серверите</button>
  <div class="card hide" id="editor">
    <p class="sub" style="margin-bottom:8px">Една адреса по ред. Се памти само на овој уред.</p>
    <textarea id="list" spellcheck="false"></textarea>
    <div class="row" style="margin-top:10px">
      <button class="go" id="save">Зачувај и барај пак</button>
      <button class="link" id="reset">Врати ги основните</button>
    </div>
  </div>

</div>

<script src="mtb-runtime.js"></script>
<script>
(function(){
  'use strict';

  // The suite's one light/dark switch (mtb-theme.js); hidden if it did not load.
  if (window.MTBTheme) {
    var themeButton = document.getElementById('theme');
    themeButton.hidden = false;
    window.MTBTheme.bind(themeButton);
  }

  // Both machines run their own server and only one is usually on. Rather than
  // remembering which, ask them all and go where the answer comes from.
  var DEFAULTS = [
    'https://pcw.tailc8965f.ts.net',
    'https://zenpc-1.tailc8965f.ts.net',
    'https://zenpc.tailc8965f.ts.net'
  ];
  var KEY = 'mtb_servers_v1';
  var ACTIVE_KEY = 'mtb_podatoci_server_v1';
  var TIMEOUT = 3500;

  var APPS = [
    { id:'s-dnevnik', file:'S-Dnevnik.html',  name:'S-Дневник',        desc:'дневник, присуство, планови, досиеја' },
    { id:'raspored',  file:'RasporediFusion.html', name:'Кабинети',     desc:'избор на ученици и неделен план на термини во кабинетите' },
    { id:'nastava',   file:'Nastava.html',    name:'Настава ↔ терапии', desc:'кој ученик недостига од кој час' },
    { id:'podatoci',  file:'Podatoci.html',    name:'Податоци',          desc:'поставување на годината, списоците и задолженијата' },
    { id:'evidenten', file:'AkciskiPlan.html', name:'Евидентен лист', desc:'пропишаниот лист и кварталниот план по категории — по секции и периоди' }
  ];
  var TOOLS = [
    { id:'nastava-uredi', file:'NastavaUredi.html', name:'Уреди настава', desc:'внесување и измени на училишниот распоред' },
    { id:'baza', file:'Pregled-Baza.html', name:'Преглед на базата', desc:'дијагностички преглед само за читање' },
    { id:'sinhronizacija', file:'Sinhronizacija.html', name:'Синхронизација', desc:'дали S-Dnevnik стигнал до базата, преносот РАБОТА ↔ ДОМА и резервите' }
  ];

  var $ = function(id){ return document.getElementById(id); };

  function servers(){
    if (window.MTB_CLOUD_SAME_ORIGIN === true) return [location.origin];
    var list = DEFAULTS;
    try {
      var v = JSON.parse(localStorage.getItem(KEY));
      if (Array.isArray(v) && v.length) list = v;
    } catch (e) { /* unreadable storage — fall through to defaults */ }
    // A running local API still works with the Internet/Tailscale unavailable.
    // The public Pages origin has no API and must never become a candidate.
    var host = location.hostname;
    if (/^https?:$/.test(location.protocol) &&
        (host === 'localhost' || host === '127.0.0.1' || host.endsWith('.ts.net'))) {
      list = [location.origin].concat(list);
    }
    return list.filter(function(base){ return typeof base === 'string'; })
      .map(function(base){ return base.trim().replace(/\/+$/, ''); })
      .filter(function(base, index, all){ return base && all.indexOf(base) === index; });
  }

  function label(target){
    var base = target && target.base ? target.base : target;
    var health = target && target.health;
    if (health && health.server && health.server.label) {
      var suffix = health.mirror ? (health.mirror.pending ? ' · КОПИЈА БЕЗ ПОДАТОЦИ' : ' · КОПИЈА САМО ЗА ЧИТАЊЕ') : '';
      return health.server.label + suffix;
    }
    try {
      var host = new URL(base).hostname.split('.')[0].toLowerCase();
      return 'СЕРВЕР · ' + host;
    } catch (e) { return base; }
  }

  // A server that is off does not answer politely — it hangs. Abort rather than
  // let one unreachable machine hold up the one that is right here.
  function probe(base){
    var ctl = new AbortController();
    var timer = setTimeout(function(){ ctl.abort(); }, TIMEOUT);
    return fetch(base + '/api/health', { signal: ctl.signal, cache: 'no-store' })
      .then(function(r){ return r.ok ? r.json() : null; })
      .then(function(b){ return (b && b.ok) ? { base:base, health:b } : null; })
      .catch(function(){ return null; })
      .then(function(res){ clearTimeout(timer); return res; });
  }

  function appLink(base, app){
    var a = document.createElement('a');
    a.className = 'app';
    a.href = base + '/' + app.file;
    a.innerHTML = '<span class="n"></span><span class="d"></span>';
    a.querySelector('.n').textContent = app.name;
    a.querySelector('.d').textContent = app.desc;
    return a;
  }

  function showApps(base){
    var box = $('apps');
    box.textContent = '';
    APPS.forEach(function(app){ box.appendChild(appLink(base, app)); });
    box.classList.remove('hide');

    var toolBox = $('toolApps');
    toolBox.textContent = '';
    TOOLS.forEach(function(app){ toolBox.appendChild(appLink(base, app)); });
    $('tools').classList.remove('hide');
  }

  function found(target){
    var base = target.base;
    try { localStorage.setItem(ACTIVE_KEY, base); } catch (e) { /* choice still works for this visit */ }
    $('dot').className = 'dot live';
    $('msg').textContent = 'Поврзан со база ';
    var machine = document.createElement('span');
    machine.className = 'machine';
    machine.textContent = label(target);
    $('msg').appendChild(machine);
    $('tried').textContent = target.health && target.health.mirror
      ? ('Извор: ' + (target.health.mirror.source || 'Supabase') + ' · податоци од: ' +
        (target.health.mirror.dataAt ? String(target.health.mirror.dataAt).replace('T',' ').slice(0,19) : 'нема успешен sync'))
      : '';
    showApps(base);

    // start.html#s-dnevnik goes straight in, so the everyday bookmark costs no taps.
    var want = (location.hash || '').replace('#','');
    var hit = APPS.concat(TOOLS).filter(function(a){ return a.id === want; })[0];
    if (hit) location.replace(base + '/' + hit.file);
  }

  function choose(list){
    $('dot').className = 'dot live';
    $('msg').textContent = 'Повеќе сервери одговараат — избери машина';
    var box = $('extra');
    box.textContent = '';
    list.forEach(function(target){
      var a = document.createElement('a');
      a.className = 'app';
      a.href = '#';
      a.innerHTML = '<span class="n"></span><span class="d">отвори ги апликациите од оваа машина</span>';
      a.querySelector('.n').textContent = label(target);
      a.addEventListener('click', function(e){ e.preventDefault(); box.textContent=''; found(target); });
      box.appendChild(a);
    });
    var n = document.createElement('div');
    n.className = 'note';
    n.innerHTML = '<b>И двете машини се вклучени.</b> Работи на едната, не на двете. Ако не си сигурен која е поновата, пушти ја синхронизацијата пред да почнеш.';
    box.appendChild(n);
  }

  function nothing(tried){
    $('dot').className = 'dot';
    $('msg').textContent = 'Ниту еден сервер не одговара';
    $('tried').textContent = tried.join('\n');

    var box = $('extra');
    box.textContent = '';
    var n = document.createElement('div');
    n.className = 'note';
    n.innerHTML = '<b>Провери го ова, по ред:</b> дали компјутерот со базата е вклучен · дали Tailscale е поврзан на овој уред · дали адресата подолу е точната.';
    box.appendChild(n);

    var h = document.createElement('p');
    h.className = 'sub';
    h.style.margin = '16px 0 8px';
    h.innerHTML = 'Можеш да го отвориш <b>S-Дневник без сервер</b> со зачуваното на овој уред. Промените остануваат локално додека не се поврзеш и синхронизираш. Распоредот на кабинети и другите екрани бараат вклучена база:';
    box.appendChild(h);

    var offline = document.createElement('div');
    offline.className = 'apps';
    // The sync page reads this browser's own diary copy, so it still has an
    // answer when no server does.
    [APPS[0], TOOLS[TOOLS.length - 1]].forEach(function(app){
      var a = appLink('.', app);
      a.href = './' + app.file;
      offline.appendChild(a);
    });
    box.appendChild(offline);
  }

  function search(){
    var list = servers();
    $('dot').className = 'dot spin';
    $('msg').textContent = 'Барам сервер…';
    $('tried').textContent = list.join('\n');
    $('apps').classList.add('hide');
    $('tools').classList.add('hide');
    $('extra').textContent = '';

    Promise.all(list.map(probe)).then(function(results){
      // localhost and the tailnet address may be the same running server.
      // Its instance id proves that; a hostname or logical role alone does not.
      var live = results.filter(Boolean).filter(function(target, index, all){
        var instance = target.health.instance;
        return !instance || all.findIndex(function(other){
          return other.health.instance === instance;
        }) === index;
      });
      if (live.length === 1) return found(live[0]);
      if (live.length > 1)  return choose(live);
      nothing(list);
    });
  }

  $('editBtn').addEventListener('click', function(){
    var ed = $('editor');
    ed.classList.toggle('hide');
    if (!ed.classList.contains('hide')) $('list').value = servers().join('\n');
  });

  $('save').addEventListener('click', function(){
    var lines = $('list').value.split('\n')
      .map(function(s){ return s.trim().replace(/\/+$/,''); })
      .filter(Boolean);
    try { localStorage.setItem(KEY, JSON.stringify(lines)); } catch (e) { /* private mode */ }
    $('editor').classList.add('hide');
    search();
  });

  $('reset').addEventListener('click', function(){
    try { localStorage.removeItem(KEY); } catch (e) { /* nothing stored */ }
    $('list').value = DEFAULTS.join('\n');
  });

  search();
})();
</script>
</body>
</html>
