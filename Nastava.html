<!DOCTYPE html>
<html lang="mk" class="mtb-flat">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Настава ↔ терапии — MTB</title>
<script src="mtb-theme.js"></script>
<script src="mtb-teacher-week.js"></script>
<script>
    // Before the first paint, so an embedded window never flashes the header.
    if (new URLSearchParams(window.location.search).has('embed')) document.documentElement.classList.add('embedded');
</script>
<!--
    Кој ученик недостига од кој час, и кај кого е.

    Оваа страница НЕ чува ништо. Нема список на ученици, нема localStorage,
    нема синхронизација — само чита од локалниот сервер и прикажува. Затоа
    може да ѝ се даде на наставник или на директор без да им се дава екранот
    за уредување на распоредот.

    Еден исклучок, само додека е вклучено „✏️ Уреди" (сопственикот, 27
    септември 2026): во „👤 Личен распоред" часот се избира во ќелијата —
    паралелка, па предмет. Не е втор запишувач: оди низ истата рута како
    „Наставник · цела недела" во Уреди настава (`PUT /api/teaching/
    teacher-lesson`, со `expected`). Исклучено, страницата е како порано.

    Целата пресметка (кој термин во кабинет со кој наставен час се преклопува,
    и колку минути) се прави на серверот, во `lib/crossing.ts`. Тука нема ниту
    еден час запишан во код — ако ѕвоната се сменат, се менува табелата
    `bell_periods` и оваа страница веднаш кажува поинаку.
-->
<link rel="stylesheet" href="mtb-look.css">
<style>
    /* Palette, header, buttons and fields are the suite's one look
       (mtb-look.css, taken from S-Dnevnik). Only this page's heat scale is
       its own. */
    /* How many children are out of a lesson, as four DIFFERENT colours rather
       than four shades of one (owner, 4 Oct 2026) — teal, amber, orange, red,
       from the control panel's palette: one is ordinary, four is a lesson
       half empty. The cell takes a tint of it over the card, so the text stays
       the page's own colour in both themes; the full colour is the bar on the
       left and the ring round the number. */
    :root {
        --heat-1: #1E9E8B;
        --heat-2: #E0A21B;
        --heat-3: #E0752D;
        --heat-4: #D64545;
        --heat-mix: 24%;
    }
    :root[data-theme="dark"] {
        --heat-1: #2BB8A3;
        --heat-2: #F0B43A;
        --heat-3: #F08A45;
        --heat-4: #EE6464;
        --heat-mix: 30%;
    }

    body { font-size: 15px; }
    header a { margin-left: auto; }

    /* The weekly grid is every teacher across five days — wider than any
       screen. A fixed reading width there does not protect anything: it
       just puts empty margin beside a table that is STILL scrolling, so
       maximising the window changed nothing. The page takes the window and
       only the prose is capped, because a 2000px line of explanation is
       what the reading width was ever for. */
    main { padding: 14px 18px 40px; max-width: none; margin: 0; }
    .panel p, .panel > .hint { max-width: 105ch; }
    /* One compact row (owner, 25 Sep 2026: the screen was too big to move
       around in). At 1280×720 the controls used to take 456px of it and the
       grid got 250; the grid is what the page is for. */
    .panel:first-child { padding: 12px 14px 0; }
    .controls { display: flex; flex-wrap: wrap; gap: 8px 10px; align-items: flex-end; }
    .controls .field { gap: 3px; }
    .controls .field span { font-size: 11px; color: var(--muted); }
    .controls .field select { min-width: 0; padding: 6px 8px; font-size: 13px; border-width: 1px; }
    .field[hidden], .btn[hidden], .chip-toggle[hidden] { display: none !important; }
    .controls .tools { display: inline-flex; gap: 6px; margin-left: auto; }
    .controls .btn { min-height: 0; padding: 7px 12px; font-size: 13px; }
    .chip-toggle { display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; border: 1px solid var(--toggle-border);
        border-radius: 999px; background: var(--toggle-bg); color: var(--toggle-text); font-size: 12.5px; font-weight: 600;
        cursor: pointer; white-space: nowrap; }
    .chip-toggle:has(input:checked) { border-color: var(--btn-bg); color: var(--text);
        background: color-mix(in srgb, var(--btn-bg) 14%, var(--card)); }
    .chip-toggle input { margin: 0; accent-color: var(--btn-bg); }
    .views { margin: 10px 0 0; }
    /* Seven views on one strip that slides sideways on a narrow window, as
       the bar's own links do, instead of three rows of tabs above the grid. */
    .views.mtb-tabs { margin-bottom: 0; flex-wrap: nowrap; overflow-x: auto; scrollbar-width: thin; }
    .views.mtb-tabs > .btn { flex: 0 0 auto; white-space: nowrap; }
    .status { flex-basis: 100%; font-size: 12px; color: var(--muted); }
    /* Inside the Workspace the window's own title bar already names the page. */
    html.embedded header { display: none; }
    .status.warn { color: var(--warn); }
    .status.error { color: var(--danger); }

    .legend { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-size: 12px; color: var(--muted); margin: 14px 0 10px; }
    .swatch { width: 26px; height: 15px; border-radius: 3px; border: 1px solid var(--border); display: inline-block; vertical-align: middle; }
    .bells { margin-left: auto; }

    /* The grid is a window of its own (owner, 25 Sep 2026). It fills the rest
       of the screen and scrolls INSIDE, so the header row and the first column
       stay where they are (frozen panes) and the sideways scrollbar is always
       on screen, instead of at the foot of a table taller than the window.
       `--grid-h` is measured in `fitGrid()`. Before this, `overflow-x: auto`
       alone made this box the header's sticky container while the PAGE did
       the vertical scrolling — so `top: 0` never held and the header left
       with the rows. The sheets (notices, personal weeks, day by day) are
       paper and keep the page's own scroll. */
    .scroll { overflow: auto; max-height: var(--grid-h, 72vh); border: 1px solid var(--border);
        border-radius: 10px; background: var(--card); scrollbar-width: auto;
        scrollbar-color: var(--toggle-border) transparent; }
    .scroll::-webkit-scrollbar { width: 14px; height: 14px; }
    .scroll::-webkit-scrollbar-thumb { background: var(--toggle-border); border-radius: 8px;
        border: 3px solid transparent; background-clip: content-box; }
    .scroll::-webkit-scrollbar-thumb:hover { background-color: var(--muted); }
    .scroll::-webkit-scrollbar-corner { background: transparent; }
    body[data-view="classweek"] .scroll, body[data-view="personal"] .scroll {
        max-height: none; overflow-y: visible; border: 0; border-radius: 0; background: transparent; }
    /* ✋ The grid moves under the hand, like a map; a click that did not move
       is still a click. */
    .scroll.hand { cursor: grab; }
    .scroll.hand table.grid { user-select: none; }
    .scroll.dragging, .scroll.dragging * { cursor: grabbing !important; }
    table.grid { border-collapse: separate; border-spacing: 0; width: 100%; font-size: 13px; }
    table.grid th, table.grid td { border-bottom: 1px solid var(--border); padding: 7px 9px; text-align: left; }
    table.grid thead th {
        position: sticky; top: 0; z-index: 2; background: var(--btn-bg); color: #fff; /* --primary is #818cf8 in the dark theme: 3:1 under white */
        font-weight: 600; white-space: nowrap; box-shadow: inset 0 -1px 0 rgba(255, 255, 255, .22);
    }
    /* The week has two header rows; the second stops under the first. */
    table.grid thead tr + tr th { top: var(--head-1, 0px); }
    /* The corner cell is frozen both ways and sits above both frozen strips. */
    table.grid thead tr:first-child th:first-child { left: 0; z-index: 4; }
    table.grid thead th small { display: block; font-weight: 400; font-size: 11px; }
    /* One day's grid: seven equal periods. Sized by content, one long subject
       name made its period twice as wide as the rest and pushed the others
       together. A teacher's name keeps to one line. */
    table.grid.day { table-layout: fixed; }
    table.grid.day thead th:first-child { width: 150px; }
    table.grid tbody th { position: sticky; left: 0; z-index: 1; background: var(--card); font-weight: 700; white-space: nowrap;
        box-shadow: 1px 0 0 var(--border), 6px 0 8px -6px rgba(0, 0, 0, .22); }
    /* Every other row a shade apart, and the row under the pointer lit, so a
       teacher's line can be followed across a week wider than the screen. */
    table.grid tbody tr:nth-child(even) th, table.grid tbody tr:nth-child(even) td.free,
    table.grid tbody tr:nth-child(even) td.heat-0 { background: var(--soft); }
    table.grid tbody tr:hover th, table.grid tbody tr:hover td.free, table.grid tbody tr:hover td.heat-0 {
        background: color-mix(in srgb, var(--btn-bg) 12%, var(--card)); }
    table.grid td.free { color: var(--muted); text-align: center; }

    .cell { border-radius: 4px; }
    .cell.clickable { cursor: pointer; }
    .cell .count {
        display: inline-block; min-width: 20px; margin-left: 6px; padding: 0 6px;
        border-radius: 10px; font-weight: 700; font-size: 11px;
        background: rgba(255, 255, 255, .8); color: #16233f;
    }
    .cell.free { color: var(--muted); }
    /* A lesson with no subject yet: in the cell's own colour, because a muted
       grey measured poorly on the darker heat shades, and upright, because a
       Macedonian italic turns „предмет" into „ūредмеш". */
    .cell .nosubj { font-weight: 400; opacity: .8; }
    /* From a class's row straight to editing that class's week. */
    .edit-week { margin-left: 6px; font-size: 12px; text-decoration: none; color: inherit; opacity: .8; }
    .edit-week:hover { opacity: 1; }
    .heat-0 { background: transparent; }
    .heat-1 { --heat: var(--heat-1); }
    .heat-2 { --heat: var(--heat-2); }
    .heat-3 { --heat: var(--heat-3); }
    .heat-4 { --heat: var(--heat-4); }
    .heat-1, .heat-2, .heat-3, .heat-4 {
        background: color-mix(in srgb, var(--heat) var(--heat-mix), var(--card));
        box-shadow: inset 4px 0 0 var(--heat);
        color: var(--text);
    }
    .heat-1 .count, .heat-2 .count, .heat-3 .count, .heat-4 .count { box-shadow: inset 0 0 0 2px var(--heat); }
    .swatch.heat-1, .swatch.heat-2, .swatch.heat-3, .swatch.heat-4 { border-color: var(--heat); }
    .cell.selected { outline: 2px solid var(--primary); outline-offset: -2px; }

    /* In the week a cell holds a class label; broken over two lines („VIII-"
       and „а") it read as two things. The grid scrolls and drags now, so a
       wider column costs nothing. */
    table.grid:not(.day) td.cell { white-space: nowrap; }
    .detail { display: none; }
    /* The lesson clicked opens OVER the grid, not under it: the grid fills
       the window now, and a panel below it would open out of sight. */
    .detail.open { display: block; position: fixed; right: 18px; bottom: 18px; z-index: 40;
        width: min(430px, calc(100vw - 36px)); max-height: 55vh; overflow: auto; margin: 0;
        box-shadow: 0 14px 38px rgba(0, 0, 0, .32); border: 1px solid var(--border); }
    .detail .detail-x { float: right; margin: -4px -6px 0 8px; padding: 2px 8px; border: 0; border-radius: 6px;
        background: transparent; color: var(--muted); font-size: 18px; cursor: pointer; }
    .detail .detail-x:hover, .detail .detail-x:focus-visible { background: var(--soft); color: var(--text); outline: none; }
    @media print { .detail { display: none !important; } }
    .detail h3 { margin: 0 0 4px; font-size: 16px; }
    .detail .meta { color: var(--muted); font-size: 13px; }
    .detail ul { margin: 10px 0 0 18px; padding: 0; }
    .detail li { margin-bottom: 4px; }

    .unplaced h3 { margin: 0 0 8px; font-size: 15px; }
    .unplaced table { border-collapse: collapse; width: 100%; font-size: 13px; }
    .unplaced td, .unplaced th { border-bottom: 1px solid var(--border); padding: 6px 9px; text-align: left; }
    .unplaced .why { color: var(--warn); }
    /* The jobs above the rows: what to DO, before the evidence for it. */
    .unplaced ul.jobs { margin: 0 0 12px; padding: 0 0 0 18px; font-size: 13px; }
    .unplaced ul.jobs li { margin-bottom: 4px; }
    .unplaced ul.jobs .meta { color: var(--muted); }

    .offline { background: var(--warn-bg); border: 1px solid var(--warn); border-radius: 8px; padding: 14px 16px; }
    .offline h3 { margin: 0 0 6px; font-size: 15px; }
    .offline code { font-family: Consolas, monospace; font-size: 13px; }

    @media print {
        .scroll { max-height: none !important; overflow: visible !important; border: 0 !important; }
        header a, .controls, .views, .btn, .edit-week { display: none !important; }
        body { background: #fff; }
        .panel { border: 0; box-shadow: none; padding: 0; }
        table.grid thead th { background: #eee !important; color: #000 !important; }
        .heat-1, .heat-2, .heat-3, .heat-4 { color: #000 !important; }
    }
    /* Известувањето е ЛИСТ, не мрежа: едно одделение по страница, зашто така
       се доставува — на секое одделение своето. */
    .notice { margin-bottom: 22px; }
    .notice h3 { margin: 0 0 2px; font-size: 16px; }
    .notice .meta { color: var(--muted); font-size: 12px; margin-bottom: 8px; }
    .notice table { border-collapse: collapse; width: 100%; font-size: 13px; }
    .notice th, .notice td { border-bottom: 1px solid var(--border); padding: 6px 9px; text-align: left; }
    .notice thead th { background: var(--btn-bg); color: #fff; font-weight: 600; white-space: nowrap; }
    .notice td.when { white-space: nowrap; }
    .notice td small { display: block; font-size: 10px; color: var(--muted); }
    .notice tr.new-day td { border-top: 2px solid var(--border); }
    .quiet { color: var(--muted); font-size: 13px; }
    /* Ден по ден: истата мрежа како „По одделение", пет пати, една под друга.
       „Цела недела" ги реди деновите НАПРЕЧНО и е поширока од секој екран; овој
       приказ е истата недела читана НАДОЛУ, што е и единствениот од двата што
       се печати без да се исече. */
    .dayblock { margin-bottom: 20px; }
    .dayblock h3 { margin: 0 0 6px; font-size: 15px; }
    .dayblock h3 small { font-weight: 400; color: var(--muted); margin-left: 8px; font-size: 12px; }
    @media print {
        .dayblock { page-break-after: always; break-after: page; }
        .dayblock:last-of-type { page-break-after: auto; break-after: auto; }
        .dayblock table { break-inside: auto; }
    }
    @media print {
        .notice { page-break-after: always; break-after: page; }
        .notice:last-of-type { page-break-after: auto; break-after: auto; }
        .notice thead th { background: #eee !important; color: #000 !important; }
    }
    /* Личен распоред and Паралелка · недела are sheets of paper; their look
       lives in mtb-teacher-week.js with the teacher's week it draws, so
       Податоци draws the same sheet. What stays here is this page's own print. */
    @media print {
        body[data-view="personal"] #detail, body[data-view="personal"] #unplaced,
        body[data-view="personal"] #external, body[data-view="personal"] #legend,
        body[data-view="classweek"] #detail, body[data-view="classweek"] #unplaced,
        body[data-view="classweek"] #external, body[data-view="classweek"] #legend { display: none !important; }
    }
    .off-staff{display:block;font-size:10px;font-weight:600;color:#b45309;margin-top:2px}
    /* Кого земаш, и каде е: името горе, каде да го најдеш под него. */
    .take { display: block; line-height: 1.25; }
    .take + .take { margin-top: 4px; padding-top: 4px; border-top: 1px dashed var(--border); }
    /* Во мрежата имињата доаѓаат под предметот и бројот, па им треба воздух. */
    .cell .take:first-of-type { margin-top: 5px; }
    /* Со имиња ќелијата носи повеќе од број, па ѝ треба ширина. Мрежата и онака
       се лизга странично — подобро лизгање отколку име скршено на четири реда. */
    body.named table.grid td.cell { min-width: 104px; }
    .take small { display: block; font-size: 10px; opacity: .72; }
    table.grid th.wk-edge, table.grid td.wk-edge { border-left: 2px solid var(--border); }
    table.grid thead th.wk-day { text-align: center; }
    #tip { position: fixed; z-index: 50; max-width: 340px; display: none; pointer-events: none;
           background: var(--card); border: 1px solid var(--border); border-radius: 8px;
           padding: 9px 11px; box-shadow: 0 8px 24px rgba(0,0,0,.28); font-size: 12px; }
    #tip h4 { margin: 0 0 5px; font-size: 12px; }
    #tip ul { margin: 4px 0 0; padding-left: 16px; }
    @media print { #tip { display: none !important; } }

    /* ⎙ Печати → the menu, only in „Преглед · недела". */
    .print-wrap { position: relative; display: inline-block; }
    .print-menu { position: absolute; right: 0; top: calc(100% + 6px); z-index: 60; width: 330px;
        display: flex; flex-direction: column; gap: 2px; padding: 6px;
        background: var(--card); border: 1px solid var(--border); border-radius: 10px;
        box-shadow: 0 14px 38px rgba(0, 0, 0, .28); }
    .print-menu[hidden] { display: none; }
    .print-menu button { all: unset; box-sizing: border-box; display: block; width: 100%; padding: 8px 10px;
        border-radius: 7px; cursor: pointer; color: var(--text); font-size: 13px; }
    .print-menu button:hover, .print-menu button:focus-visible { background: var(--soft); }
    .print-menu small { display: block; margin-top: 2px; color: var(--muted); font-size: 11.5px; line-height: 1.35; white-space: normal; }

    /* The poster: the school's own printed timetable (owner, 4 Oct 2026, a
       photo of the staff-room board) — black lines on white, names in
       capitals, РЕД. БР. · ИМЕ И ПРЕЗИМЕ · ОДД, then the days with their
       periods, „/" for a free period. Two tables: одделенска настава, whose
       cells are the SUBJECT (the class is the teacher's own, said once), and
       предметна, whose cells are the CLASS (the subject is said once). No
       colours and no counts: this is the timetable, not who is out of it.
       Sized in millimetres for A2 landscape (594 × 420), or the same poster cut
       into four A4 landscape sheets that overlap by 1 cm. Built only when printed. */
    #poster { display: none; }
    #poster.measure { display: block; position: fixed; left: -30000px; top: 0; visibility: hidden; }
    #poster, #poster * { box-sizing: border-box; }
    #poster { -webkit-print-color-adjust: exact; print-color-adjust: exact; color: #000; background: #fff;
        font-family: "Times New Roman", Times, serif; }
    .pz-page { position: relative; overflow: hidden; background: #fff; break-after: page; page-break-after: always; }
    .pz-page:last-child { break-after: auto; page-break-after: auto; }
    .pz-page.a2 { width: 594mm; height: 420mm; }
    .pz-page.tile { width: 297mm; height: 210mm; }
    .pz-view { position: absolute; left: 10mm; top: 10mm; overflow: hidden; }
    .pz-page.a2 .pz-view { width: 574mm; height: 400mm; }
    .pz-page.tile .pz-view { width: 277mm; height: 190mm; outline: 0.2mm dashed #888; }
    .pz-area { position: absolute; left: 0; top: 0; }
    .pz-note { position: absolute; left: 10mm; right: 10mm; bottom: 3mm; font: 7.5pt "Segoe UI", sans-serif; color: #555;
        display: flex; justify-content: space-between; }
    .poster { transform-origin: 0 0; }
    .pz-head { display: flex; align-items: flex-end; gap: 8mm; }
    .pz-title { flex: 1; }
    .pz-title .school { font-size: 12pt; font-weight: 700; text-transform: uppercase; }
    .pz-title h1 { margin: 1mm 0 0; font-size: 22pt; text-transform: uppercase; letter-spacing: 0.3mm; }
    .pz-title .year { font-size: 30pt; font-weight: 700; line-height: 1; margin-top: 2mm; }
    .pz-bells { border-collapse: collapse; font-size: 9pt; font-weight: 700; }
    .pz-bells th, .pz-bells td { border: 0.35mm solid #000; padding: 0.8mm 1.6mm; text-align: center; white-space: nowrap; }
    .pz-bells th { background: #ececec; }
    .pz-bells .rest { font-weight: 400; font-style: italic; }
    .pz-sec { margin-top: 6mm; }
    .pz-sec h2 { margin: 0 0 1.5mm; font-size: 15pt; text-transform: uppercase; letter-spacing: 0.3mm; }
    .pz-table { width: 100%; table-layout: fixed; border-collapse: collapse; font-size: 10pt; font-weight: 700; }
    .pz-table th, .pz-table td { border: 0.35mm solid #000; padding: 1.4mm 0.6mm; text-align: center; vertical-align: middle; }
    /* The rows grow to fill the sheet (fitPoster); the head stays as it is. */
    .pz-table tbody th, .pz-table tbody td { padding-top: var(--pz-pad, 1.4mm); padding-bottom: var(--pz-pad, 1.4mm); }
    .pz-table thead th { background: #ececec; font-size: 9pt; text-transform: uppercase; }
    .pz-table thead th.day { font-size: 11pt; letter-spacing: 0.3mm; }
    .pz-table .edge { border-left-width: 0.9mm; }
    .pz-table .lead { border-right-width: 0.9mm; }
    .pz-table tbody th.name { text-align: center; text-transform: uppercase; font-size: 10pt; line-height: 1.15; }
    .pz-table tbody td.odd { font-size: 9pt; line-height: 1.15; overflow-wrap: anywhere; }
    .pz-table small { display: block; font-size: 7pt; font-weight: 400; text-transform: none; }
    .pz-table td.free { font-weight: 400; }
    .pz-c { white-space: nowrap; }
    .pz-off { display: block; font-size: 7pt; font-weight: 400; text-transform: none; font-style: italic; }
    .pz-foot { margin-top: 3mm; font: 8pt "Segoe UI", sans-serif; color: #444; display: flex; justify-content: space-between; }
    @media print {
        body[data-print] > *:not(#poster) { display: none !important; }
        body[data-print] { background: #fff !important; margin: 0 !important; padding: 0 !important; }
        body[data-print] #poster { display: block; position: static; visibility: visible; }
    }
</style>
</head>
<body>
<header>
    <h1>🏫 Настава ↔ терапии</h1>
    <span class="sub">Кој недостига од часот, и кого кабинетот го зема — истото, од двете страни</span>
</header>

<main>
    <div class="panel">
        <div class="controls">
            <label class="field">
                <span>Учебна година</span>
                <select id="year" disabled></select>
            </label>
            <label class="field" id="klassField" hidden>
                <span>Паралелка</span>
                <select id="klass"><option value="">Сите паралелки</option></select>
            </label>
            <label class="field" id="whoField" hidden>
                <span>Наставник</span>
                <select id="who"><option value="">Сите наставници</option></select>
            </label>
            <!-- The suite's „✏️ Уреди" switch, where Личен распоред is read: on,
                 every period of the sheet is a class and a subject picker. -->
            <button type="button" class="btn soft" id="personalEdit" hidden></button>
            <label class="field">
                <span>Отсутен ако пропушти</span>
                <select id="share">
                    <option value="0.5" selected>половина час или повеќе</option>
                    <option value="0">кој било дел од часот</option>
                    <option value="0.9">речиси цел час</option>
                </select>
            </label>
            <label class="chip-toggle" id="namedField" title="Во ќелијата да пишува кое дете и кај кој терапевт, не само колку">
                <input type="checkbox" id="named">
                <span>Кој кого зема</span>
            </label>
            <label class="chip-toggle" title="Картичка со детали кога глувчето ќе застане на ќелија">
                <input type="checkbox" id="hoverCard" checked>
                <span>Картичка</span>
            </label>
            <label class="chip-toggle"
                   title="Мрежата се влече со глувчето — лево, десно, горе, долу — наместо со лизгачот. Клик без влечење и понатаму ја отвора ќелијата.">
                <input type="checkbox" id="hand" checked>
                <span>✋ Влечи</span>
            </label>
            <span class="tools">
                <button class="btn" id="refresh" title="Освежи од базата" aria-label="Освежи"><span class="ico" aria-hidden="true">↻</span></button>
                <span class="print-wrap">
                    <button class="btn soft" id="printBtn" aria-expanded="false"><span class="ico" aria-hidden="true">⎙</span> Печати</button>
                    <!-- Only in „Преглед · недела": the week as a wall poster (owner, 4 Oct 2026). -->
                    <span class="print-menu" id="printMenu" role="menu" hidden>
                        <button type="button" role="menuitem" data-print="screen"><b>⎙ Како на екранот</b>
                            <small>Мрежата онаква каква што е, на листовите што ќе ги избере печатачот.</small></button>
                        <button type="button" role="menuitem" data-print="a2"><b>📐 Постер A2, една страница</b>
                            <small>Одделенска и предметна настава во посебни табели. „Зачувај како PDF“ дава векторски PDF, јасен во секоја големина.</small></button>
                        <button type="button" role="menuitem" data-print="tiles"><b>🧩 A2 на 4 листа A4</b>
                            <small>Истиот постер во четири дела; соседните се преклопуваат 1 cm за лепење.</small></button>
                    </span>
                </span>
                <a class="btn soft" href="NastavaUredi.html"
                   title="Внеси или промени го распоредот на настава — цела страница за уредување"><span class="ico" aria-hidden="true">✏️</span> Уреди настава</a>
            </span>
            <span class="status" id="status"></span>
        </div>
        <div class="views mtb-tabs mtb-tabs-flat">
            <button class="btn soft" id="viewClassWeek" aria-pressed="true"
                    title="Неделата на паралелката: кој час, кој наставник — и кое дете, во кој кабинет, во колку часот">🏫 Паралелка · недела</button>
            <button class="btn soft" id="viewPersonal" aria-pressed="false"
                    title="Неделата на наставникот, со тоа кој ученик кога оди на третман — за печатење, по еден лист">👤 Наставник · недела</button>
            <button class="btn soft" id="viewWeek" aria-pressed="false"
                    title="Сите наставници, целата недела, со бојата колку деца излегуваат од часот">📊 Преглед · недела</button>
        </div>
    </div>

    <div class="panel" id="gridPanel">
        <div class="legend" id="legend"></div>
        <div class="scroll"><div id="grid"></div></div>
    </div>

    <div class="panel detail" id="detail"></div>
    <div class="panel unplaced" id="unplaced" style="display:none;"></div>
    <div class="panel unplaced" id="external" style="display:none;"></div>
</main>
<div id="poster" aria-hidden="true"></div>

<script>
(function () {
    'use strict';

    const DAYS = ['понеделник', 'вторник', 'среда', 'четврток', 'петок'];

    let data = null;
    let selected = null;    // "класа|час", или "ден|класа|час" во неделниот приказ
    let tipCell = null;     // ќелијата под покажувачот, за да се премести картичката
    let view = 'classweek';
    // Кажува ли ќелијата кој кабинет кое дете зема, или само колку се.
    // Држено во променлива, не во localStorage: оваа страница намерно не чува
    // ништо во прелистувачот.
    let named = false;
    // Картичката на лебдење е брз поглед и некому пречи додека чита мрежа. Ниту
    // еден одговор не зависи само од неа — панелот на клик останува — па
    // гаснењето не крие ништо. Во променлива, не во localStorage: страницата
    // намерно не чува ништо во прелистувачот.
    let hoverCard = true;
    // Two views cross the WHOLE week rather than one day: the weekly grid and
    // the per-class notice sheet. It is the same request either way — the
    // endpoint already answers for the week when no day is named.
    // Every view is a week since 27 Sep 2026 (owner): the single-day grids
    // went, with the day chooser. Kept as a function, because the panel's
    // heading and the status line ask it rather than a view's name.
    const wholeWeek = () => true;
    // Every request carries a number and only the newest one may draw. Without
    // this, changing the day while the first fetch is still running leaves the
    // previous day's grid on screen under the new day's label.
    let ticket = 0;

    const el = (id) => document.getElementById(id);
    const esc = (v) => String(v == null ? '' : v)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');

    function status(text, kind) {
        const node = el('status');
        node.textContent = text || '';
        node.className = 'status' + (kind ? ' ' + kind : '');
        let dataState = kind === 'error' ? 'error' : kind === 'warn' ? 'warning' : 'readonly';
        if (/вчитув|проверув/i.test(text || '')) dataState = 'loading';
        const detail = { state: dataState, text: text || 'Само читање од базата' };
        window.__MTB_DATA_STATE__ = detail;
        window.dispatchEvent(new CustomEvent('mtb:data-state', { detail }));
    }

    /**
     * Where the API lives.
     *
     * Served BY a server this is that origin, which is exactly what the bare
     * relative path meant before — nothing changes on a tailnet address. Opened
     * from GitHub Pages it is the database chosen in the shared bar, so this
     * page stops being dead there. The choice is one key for the whole suite,
     * so two screens cannot end up looking at two different databases.
     */
    function apiBase() {
        try {
            const nav = window.MTBAppNavigation;
            return (nav && typeof nav.apiBase === 'function' && nav.apiBase()) || '';
        } catch (_) { return ''; }
    }

    async function fillYears() {
        const select = el('year');
        if (select.options.length) return;
        const res = await fetch(apiBase() + '/api/years', { cache: 'no-store' });
        const years = await res.json();
        if (!res.ok) throw new Error((years && years.error) || ('HTTP ' + res.status));
        const requested = new URLSearchParams(window.location.search).get('year');
        years.forEach((year) => {
            const opt = document.createElement('option');
            opt.value = year.label;
            opt.textContent = year.label + (year.is_current ? ' · тековна' : ' · архива');
            select.appendChild(opt);
        });
        const fallback = years.find((year) => year.is_current) || years[0];
        select.value = years.some((year) => year.label === requested) ? requested : (fallback && fallback.label);
        select.disabled = !select.options.length;
    }

    /**
     * The page is served BY the API, so a relative path is the whole story —
     * and it is deliberately relative rather than configurable. A copy opened
     * from GitHub Pages has no server behind it and must say so, not quietly
     * point itself at somebody's machine.
     */
    async function load() {
        const mine = ++ticket;
        status('вчитувам…');
        try {
            await fillYears();
            const year = el('year').value;
            const share = el('share').value;
            // The weekly view crosses every day at once, and the endpoint
            // already answers for the whole week when no day is named. Asking
            // five times and stitching the answers together in the browser
            // would be a second opinion about the same arithmetic.
            const dayParam = '';
            const res = await fetch(
                `${apiBase()}/api/teaching/crossing?year=${encodeURIComponent(year)}${dayParam}`
                    + `&minShare=${encodeURIComponent(share)}`,
                { cache: 'no-store' }
            );
            let body = null;
            try { body = await res.json(); } catch (e) { /* не-JSON */ }
            if (mine !== ticket) return;
            if (!res.ok) throw new Error((body && body.error) || ('HTTP ' + res.status));
            data = body;
            selected = null;
            draw();
            if (!body.cells.length) {
                status('Серверот нема внесен распоред на настава.', 'warn');
            } else {
                const yearLabel = body.year + (body.isCurrentYear ? '' : ' · архивски приказ');
                const ext = body.summary.external
                    ? ` · ${body.summary.external} кај екстерни ученици`
                    : '';
                const off = body.summary.offStaffLessons
                    ? ` · ${body.summary.offStaffLessons} часа кај наставник вон списокот`
                    : '';
                const scope = wholeWeek() ? ' · цела недела' : '';
                status(`${yearLabel}${scope} · ${body.summary.placed} од ${body.summary.sessions} третмани се поврзани со час${ext} · `
                     + `${body.summary.lessonsDisrupted} часа со отсутни${off}`);
            }
        } catch (err) {
            if (mine !== ticket) return;
            data = null;
            selected = null;
            offline(err);
        }
    }

    function offline(err) {
        el('legend').innerHTML = '';
        el('detail').className = 'panel detail';
        el('unplaced').style.display = 'none';
        el('external').style.display = 'none';
        el('grid').innerHTML =
            '<div class="offline"><h3>Нема врска со серверот</h3>'
            + '<p>Овој преглед се пресметува на серверот — без него нема ни распоред на настава за вкрстување.</p>'
            + '<p>Ако страницата е отворена од интернет (GitHub Pages), отвори ја преку '
            + '<a href="start.html">start.html</a>, кој наоѓа кој компјутер е вклучен.</p>'
            + `<p class="meta"><code>${esc(err.message)}</code></p></div>`;
        status('серверот не одговара', 'error');
    }

    /**
     * Кој кого зема, напишано во самата ќелија.
     *
     * „По кабинет" веќе го кажува ова од страната на кабинетот; ова е истото во
     * мрежата на наставата, зашто прашањето е двонасочно — наставникот сака да
     * знае кој му се губи И кај кого оди. ПРЕГРУПИРАЊЕ на `away`, како секаде
     * тука: пресметката е една и е во `lib/crossing.ts`.
     *
     * Бројот останува покрај имињата наместо да биде заменет: мрежата се чита
     * попреку за „каде е густо", а тоа е бројка, не список.
     */
    function takenHtml(cells) {
        if (!named) return '';
        const out = [];
        cells.forEach((c) => (c.away || []).forEach((a) => out.push(a)));
        if (!out.length) return '';
        return out
            .sort((a, b) => a.student.localeCompare(b.student, 'mk'))
            .map((a) => `<span class="take"><b>${esc(a.student)}</b>`
                + `<small>${esc(a.therapist)}</small></span>`).join('');
    }

    /**
     * Кои луѓе ги засега оваа ќелија, за осветлувањето од работниот простор.
     *
     * Ќелијата носи ПОВЕЌЕ клучеви: наставникот што го држи часот и секое дете
     * што е изземено од него. Едно дете и еден наставник не се исклучуваат —
     * тоа е истата ќелија гледана од двете страни, што е целата поента на оваа
     * страница.
     */
    function focusKeys(cells) {
        const keys = new Set();
        cells.forEach((c) => {
            const t = (data.teachers || []).find((x) => x.name === c.teacher);
            if (t) keys.add('teacher:' + t.id);
            (c.away || []).forEach((a) => { if (a.studentPublicId) keys.add('student:' + a.studentPublicId); });
        });
        // JSON, not a space-separated list: an id may contain anything, and a
        // key split in half matches nothing while looking like it should.
        return keys.size ? ` data-focus="${esc(JSON.stringify([...keys]))}"` : '';
    }

    /** A redraw makes new elements; the highlight has to be put back on them. */
    function refocus() {
        try {
            const nav = window.MTBAppNavigation;
            if (nav && nav.applyFocus) nav.applyFocus();
        } catch (_) { /* без лентата, нема ни осветлување */ }
    }

    /** 0..4+, so the darkest shade means "four or more, look at this". */
    const heat = (n) => 'heat-' + Math.max(0, Math.min(4, n));

    function drawLegend() {
        const covers = (data.bells.cabinet || []).map((b) =>
            `${esc(b.label)} ${esc(b.startsAt)}→${(b.covers || []).map((c) => c.ordinal + '.').join('+') || '—'}`
        ).join(' · ');
        el('legend').innerHTML =
            '<span>Отсутни од часот:</span>'
            + [0, 1, 2, 3, 4].map((n) => `<span><i class="swatch ${heat(n)}"></i> ${n === 4 ? '4+' : n}</span>`).join('')
            + (covers ? `<span class="bells">Кабинет → наставен час: ${covers}</span>` : '');
    }

    function draw() {
        if (!data) return;
        hideTip();
        // The heat swatches explain a grid. The notice sheet has no cells to
        // shade, so a legend there would be a key to nothing.
        if (view === 'week') drawLegend();
        else el('legend').innerHTML = '';
        if (view === 'week') drawWeek();
        else if (view === 'personal') drawPersonal();
        else drawClassWeek();
        drawUnplaced();
        drawExternal();
        markSelected();
        refocus();
        fitGrid();
    }

    /**
     * The grid's window: the rest of the screen below the controls, so its
     * header, first column and scrollbar are all visible without scrolling
     * the page. Measured, not guessed — the controls wrap onto more lines on
     * a narrow window, and inside the Workspace the window is a pane.
     */
    function fitGrid() {
        const box = document.querySelector('#gridPanel .scroll');
        if (!box) return;
        const top = box.getBoundingClientRect().top + window.scrollY;
        document.documentElement.style.setProperty('--grid-h', Math.max(240, Math.floor(window.innerHeight - top - 16)) + 'px');
        const first = box.querySelector('table.grid thead tr');
        box.style.setProperty('--head-1', (first ? first.getBoundingClientRect().height : 0) + 'px');
        box.classList.toggle('hand', hand && Boolean(box.querySelector('table.grid')));
    }

    /**
     * ✋ Влечи со рака (owner, 25 Sep 2026): the week is wider than any screen,
     * and a thin scrollbar is hard to hit. With the mouse the grid is dragged
     * like a map, in both directions. It only takes over after the pointer has
     * moved a few pixels, so a click that did not move still opens the lesson.
     * A finger already pans natively, so touch is left alone.
     */
    let hand = true;
    (function installHand() {
        const box = document.querySelector('#gridPanel .scroll');
        let drag = null;
        let moved = false;
        box.addEventListener('pointerdown', (event) => {
            moved = false;
            if (!hand || event.button !== 0 || event.pointerType === 'touch') return;
            if (!box.querySelector('table.grid')) return;
            if (event.target.closest('a, button, input, select, textarea, label')) return;
            drag = { x: event.clientX, y: event.clientY, left: box.scrollLeft, top: box.scrollTop, id: event.pointerId };
        });
        box.addEventListener('pointermove', (event) => {
            if (!drag || event.pointerId !== drag.id) return;
            const dx = event.clientX - drag.x;
            const dy = event.clientY - drag.y;
            if (!moved) {
                if (Math.abs(dx) + Math.abs(dy) < 6) return;
                moved = true;
                box.setPointerCapture(event.pointerId);
                box.classList.add('dragging');
                hideTip();
            }
            box.scrollLeft = drag.left - dx;
            box.scrollTop = drag.top - dy;
        });
        const release = () => {
            drag = null;
            box.classList.remove('dragging');
        };
        box.addEventListener('pointerup', release);
        box.addEventListener('pointercancel', release);
        // The click that ends a drag is not a click on a lesson.
        box.addEventListener('click', (event) => {
            if (!moved) return;
            moved = false;
            event.stopPropagation();
            event.preventDefault();
        }, true);
    })();

    /**
     * Every class on the year's list gets a row, even one with no lesson yet —
     * plus any the timetable names that is NOT on the list, marked rather than
     * dropped. The same split as `teacherRows`, for the same reason: the list
     * of CLASSES and the list of LESSONS are different questions.
     *
     * Reading the first out of the second emptied this whole view the morning a
     * year's invalid timetable was thrown away to be retyped — sixteen classes
     * alive in the database and not one row on screen.
     *
     * The server's order is KEPT, never re-sorted here: it comes from
     * `sort_key`, which knows that IX follows VIII. `localeCompare` does not —
     * it reads the labels as words and puts IX before V.
     */
    /** The same class's whole week in Уреди настава, in the same year. */
    function editWeekHref(label) {
        return 'NastavaUredi.html?view=classweek&class=' + encodeURIComponent(label)
            + '&year=' + encodeURIComponent(el('year').value);
    }

    function classRows() {
        const rows = new Map();
        (data.classes || []).forEach((c) => rows.set(c.label, new Map()));
        const offList = new Set();
        data.cells.forEach((c) => {
            if (!rows.has(c.class)) { rows.set(c.class, new Map()); offList.add(c.class); }
        });
        return { rows, offList, order: Array.from(rows.keys()) };
    }

    // How a class READS in a row head (migration 045): the short form of its
    // name for the year, through the one helper every screen shares. The
    // label stays in every link and key.
    function classShort(label) {
        const nav = window.MTBAppNavigation;
        const c = (data.classes || []).find((x) => x.label === label);
        return c && nav && nav.classes && nav.classes.short ? nav.classes.short({ label: c.label, alias: String(c.alias || '').replace(/\s+/g, ' ').trim() }) : label;
    }

    /**
     * Every teacher on the year's staff list gets a row, even one with no
     * lesson at all — plus anyone the timetable names who is NOT on the list,
     * who is marked rather than dropped.
     *
     * The list of PEOPLE and the list of LESSONS are different questions, and
     * reading the first out of the second is what made this page disagree with
     * „Податоци" by everybody who had not been given a lesson yet. An empty row
     * says „on the staff, nothing timetabled"; a missing row says nothing at
     * all, and reads as data loss.
     */
    function teacherRows() {
        return window.MTBTeacherWeek.teacherRows(data);
    }

    /**
     * The whole week: teachers down the page, the five days across it.
     *
     * This is the shape the staff room asks in — „кога сум јас слободен, и кој
     * ми недостига од часот" — which neither single-day view can answer without
     * clicking through the days one at a time.
     *
     * It is drawn from the SAME crossing the other two views use, fetched
     * without a day. Nothing about the overlap is recomputed here: `awayCount`
     * and `away` arrive already measured in real minutes by `lib/crossing.ts`,
     * which is deliberately the only copy of that arithmetic — a second one in
     * the browser could drift by a minute and nobody would see it.
     */
    function drawWeek() {
        const periods = data.bells.teaching || [];
        // teacher -> "ден|час" -> the lessons in that slot
        const { rows: byTeacher, offStaff, order } = teacherRows();
        data.cells.forEach((c) => {
            const slot = byTeacher.get(c.teacher || '— без наставник —');
            const at = c.day + '|' + c.ordinal;
            if (!slot.has(at)) slot.set(at, []);
            slot.get(at).push(c);
        });

        // Only the days the timetable actually uses, in the school's own order.
        const days = DAYS.filter((d) => data.cells.some((c) => c.day === d));
        if (!days.length || !periods.length) {
            el('grid').innerHTML = '<div class="offline"><p>Нема внесени часови за оваа година.</p></div>';
            return;
        }

        const cap = (d) => d.charAt(0).toUpperCase() + d.slice(1);
        const head = '<tr><th rowspan="2">Наставник</th>'
            + days.map((d) =>
                `<th class="wk-day wk-edge" colspan="${periods.length}">${esc(cap(d))}</th>`).join('')
            + '</tr><tr>'
            + days.map(() => periods.map((p, i) =>
                `<th${i === 0 ? ' class="wk-edge"' : ''}>${esc(String(p.ordinal))}.`
                + `<small>${esc(p.startsAt)}</small></th>`).join('')).join('')
            + '</tr>';

        let html = '<table class="grid"><thead>' + head + '</thead><tbody>';
        order.forEach((name) => {
            const who = (data.teachers || []).find((x) => x.name === name);
            html += `<tr><th${who ? ` data-focus="teacher:${who.id}"` : ''}>${esc(name)}`
                + (offStaff.has(name) ? '<span class="off-staff">не е на списокот оваа година</span>' : '')
                + '</th>';
            days.forEach((d) => {
                periods.forEach((p, i) => {
                    const edge = i === 0 ? ' wk-edge' : '';
                    const list = byTeacher.get(name).get(d + '|' + p.ordinal) || [];
                    if (!list.length) { html += `<td class="cell free${edge}">—</td>`; return; }
                    const away = list.reduce((n, c) => n + c.awayCount, 0);
                    const text = list.map((c) => c.class + (c.subject ? ' · ' + c.subject : '')).join(' / ');
                    // Every lesson carries a key, not only the disrupted ones:
                    // hovering a quiet lesson must be able to say "nobody is
                    // out", which is an answer, not an empty tooltip.
                    const key = d + '|' + list[0].class + '|' + p.ordinal;
                    html += `<td class="cell ${heat(away)}${edge}${away ? ' clickable' : ''}"`
                        + focusKeys(list)
                        + ` data-key="${esc(key)}" title="${esc(text)}">`
                        + esc(list.map((c) => c.class).join(' / '))
                        + (away ? `<span class="count">${away}</span>` : '')
                        + takenHtml(list)
                        + '</td>';
                });
            });
            html += '</tr>';
        });
        el('grid').innerHTML = html + '</tbody></table>';
    }

    // ── ⎙ the week as a wall poster ───────────────────────────────────────
    /**
     * The owner (4 Oct 2026): the week by teacher, printed big — one A2 sheet,
     * or A2 cut into four A4 sheets glued together — in the look of the
     * school's own printed timetable on the staff-room board. Two tables:
     *
     *   одделенска — one teacher, ONE class (their own) all week: the class is
     *     said once, in ОДД, and each period says the SUBJECT;
     *   предметна  — one teacher, ONE subject, many classes: the subject is
     *     said once, and each period says the CLASS.
     *
     * The cell holds what changes; what does not change is said once at the
     * head of the row. No counts and no colours: the poster is the timetable,
     * not who is out of it. Classes as the database has them (VI-а, VIII-б).
     *
     * Millimetres throughout, and the browser's own „Save as PDF": the PDF is
     * vector, sharp at A2 or larger. The rows grow to fill the sheet; a staff
     * list that outgrows it is scaled down rather than cut.
     */
    const POSTER = {
        a2: { page: [594, 420], area: [574, 400] },
        // Four A4 landscape sheets: each shows 277 × 190 mm of the poster and
        // repeats 10 mm of its neighbour, which is where they are glued.
        tiles: { page: [297, 210], view: [277, 190], overlap: 10 }
    };

    /**
     * A subject as the board writes it: short, small letters, no closing dot
     * („мак.“ → „мак“, „П.Н.“ → „п.н“). A whole name the timetable was typed
     * with is shortened by the same habit: two words → the first three letters
     * of the first („Македонски јазик“ → „мак“), more → the initials
     * („Физичко и здравствено образование“ → „фзо“), one → its first three.
     */
    function shortSubject(subject) {
        const s = String(subject || '').replace(/\s+/g, ' ').trim();
        if (!s) return '';
        const lower = s.toLocaleLowerCase('mk-MK');
        if (s.length <= 8 || s.includes('.')) return lower.replace(/\.+$/, '');
        const words = lower.split(' ').filter((w) => w.length > 2);
        if (words.length <= 1) return (words[0] || lower).slice(0, 3);
        if (words.length === 2) return words[0].slice(0, 3);
        return words.map((w) => w[0]).join('');
    }

    /** The bells as the board has them: each period, and the break after it. */
    function bellsHtml(periods) {
        const mins = (t) => { const [h, m] = String(t || '').split(':').map(Number); return h * 60 + m; };
        const clockOf = (m) => String(Math.floor(m / 60)).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0');
        const heads = [];
        const times = [];
        periods.forEach((p, i) => {
            const start = mins(p.startsAt);
            const end = start + Number(p.minutes || 0);
            heads.push(`<th>${esc(String(p.ordinal))} час</th>`);
            times.push(`<td>${clockOf(start)}–${clockOf(end)}</td>`);
            const next = periods[i + 1] ? mins(periods[i + 1].startsAt) : NaN;
            if (Number.isFinite(next) && next > end) {
                heads.push('<th class="rest">одмор</th>');
                times.push(`<td class="rest">${clockOf(end)}–${clockOf(next)}</td>`);
            }
        });
        return periods.length ? `<table class="pz-bells"><tr>${heads.join('')}</tr><tr>${times.join('')}</tr></table>` : '';
    }

    /**
     * One table of the poster. `lead(name)` is what is said once at the head
     * of the row; `cell(list, name)` what each period says.
     */
    function posterTableHtml(names, periods, days, byTeacher, offStaff, leadHead, lead, cell) {
        const head = '<tr><th rowspan="2">Ред. бр.</th><th rowspan="2">Име и презиме</th>'
            + `<th rowspan="2" class="lead">${esc(leadHead)}</th>`
            + days.map((d) => `<th class="day edge" colspan="${periods.length}">${esc(d)}</th>`).join('')
            + '</tr><tr>'
            + days.map(() => periods.map((p, i) =>
                `<th${i === 0 ? ' class="edge"' : ''}>${esc(String(p.ordinal))}</th>`).join('')).join('')
            + '</tr>';
        const body = names.map((name, n) => {
            let row = `<tr><td>${n + 1}.</td><th class="name">${esc(name)}`
                + (offStaff.has(name) ? '<span class="pz-off">не е на списокот оваа година</span>' : '') + '</th>'
                + `<td class="odd lead">${lead(name)}</td>`;
            days.forEach((d) => periods.forEach((p, i) => {
                const edge = i === 0 ? ' edge' : '';
                const list = (byTeacher.get(name) && byTeacher.get(name).get(d + '|' + p.ordinal)) || [];
                row += list.length ? `<td class="${edge.trim()}">${cell(list, name)}</td>` : `<td class="free${edge}">/</td>`;
            }));
            return row + '</tr>';
        }).join('');
        const cols = '<colgroup><col style="width:11mm"><col style="width:50mm"><col style="width:27mm">'
            + days.map(() => periods.map(() => '<col>').join('')).join('') + '</colgroup>';
        return `<table class="pz-table">${cols}<thead>${head}</thead><tbody>${body}</tbody></table>`;
    }

    function posterHtml() {
        const periods = data.bells.teaching || [];
        const days = DAYS.filter((d) => data.cells.some((c) => c.day === d));
        const { rows: byTeacher, offStaff, order } = teacherRows();
        data.cells.forEach((c) => {
            const slot = byTeacher.get(c.teacher || NOBODY);
            const at = c.day + '|' + c.ordinal;
            if (!slot.has(at)) slot.set(at, []);
            slot.get(at).push(c);
        });
        const teacher = (name) => (data.teachers || []).find((t) => t.name === name) || {};
        // In the order of the classes (the server's sort_key, so IX follows
        // VIII): одделенски by their own class; among the предметни the
        // класни раководители first, as on the board, then the rest by name.
        const classAt = new Map((data.classes || []).map((c, i) => [c.label, i]));
        const byClass = (a, b) => (classAt.get(teacher(a).homeroom) ?? 999) - (classAt.get(teacher(b).homeroom) ?? 999)
            || a.localeCompare(b, 'mk');
        const odd = order.filter((n) => teacher(n).kind === 'odd').sort(byClass);
        const pred = order.filter((n) => teacher(n).kind === 'pred').sort(byClass);
        const rest = order.filter((n) => !odd.includes(n) && !pred.includes(n));

        // Одделенска: ОДД is the teacher's own class; a period says the subject,
        // and the class too on the rare lesson in somebody else's.
        const ownClass = (name) => esc(teacher(name).homeroom || '—');
        const subjectCell = (list, name) => list.map((c) => esc(shortSubject(c.subject) || '—')
            + (c.class !== teacher(name).homeroom ? `<small>${esc(c.class)}</small>` : '')).join(' / ');
        // Предметна: the subject is said once; a period says the class.
        // From the teacher's own list; where nobody typed one there, the subject
        // the timetable has them teaching most often.
        const taught = (name) => {
            const count = new Map();
            byTeacher.get(name).forEach((list) => list.forEach((c) => {
                const s = shortSubject(c.subject);
                if (s) count.set(s, (count.get(s) || 0) + 1);
            }));
            const top = [...count].sort((a, b) => b[1] - a[1])[0];
            return top ? top[0] : '';
        };
        const ownSubject = (name) => {
            const t = teacher(name);
            let subjects = String(t.subject || '').split(',').map(shortSubject).filter(Boolean);
            if (!subjects.length && taught(name)) subjects = [taught(name)];
            subjects = subjects.map((s) => s.toLocaleUpperCase('mk-MK'));
            return esc(subjects.join(', ') || '—') + (t.homeroom ? `<small>раков. ${esc(t.homeroom)}</small>` : '');
        };
        const classCell = (list) => list.map((c) => `<span class="pz-c">${esc(c.class)}</span>`).join(' / ');

        const section = (title, names, leadHead, lead, cell) => names.length
            ? `<section class="pz-sec"><h2>${esc(title)}</h2>`
                + posterTableHtml(names, periods, days, byTeacher, offStaff, leadHead, lead, cell) + '</section>'
            : '';
        return '<div class="poster">'
            + '<header class="pz-head"><div class="pz-title">'
            + `<div class="school">${esc(SCHOOL)}</div><h1>Распоред на часови</h1>`
            + `<div class="year">${esc(data.year)} год.</div></div>`
            + bellsHtml(periods) + '</header>'
            + section('Одделенска настава', odd, 'Одд', ownClass, subjectCell)
            + section('Предметна настава', pred, 'Предмет', ownSubject, classCell)
            + section('Други', rest, 'Предмет', ownSubject, classCell)
            + '<div class="pz-foot"><span>/ слободен час · — час без внесен предмет</span>'
            + `<span>Отпечатено ${esc(new Date().toLocaleDateString('mk-MK'))} · MTB</span></div>`
            + '</div>';
    }

    /**
     * Lay the poster out at the area's width, and if it is taller than the
     * area, scale it until it fits (its width grows by the same factor first,
     * so after scaling it still fills the sheet edge to edge).
     */
    function fitPoster(box, area) {
        const mm = 96 / 25.4;
        const inner = box.querySelector('.poster');
        inner.style.width = area[0] + 'mm';
        inner.style.removeProperty('--pz-pad');
        // Room to spare: the rows take it, up to a comfortable height, so a
        // short staff list does not sit on the top half of the sheet.
        const rows = inner.querySelectorAll('.pz-table tbody tr').length;
        const spare = area[1] - inner.scrollHeight / mm;
        if (rows && spare > 0) inner.style.setProperty('--pz-pad', Math.min(1.6 + spare / rows / 2 * 0.92, 5).toFixed(2) + 'mm');
        let scale = 1;
        for (let i = 0; i < 3; i++) {
            inner.style.width = (area[0] / scale) + 'mm';
            inner.style.transform = scale < 1 ? `scale(${scale})` : '';
            const tall = inner.scrollHeight / mm;
            const next = Math.min(1, area[1] / tall);
            if (Math.abs(next - scale) < 0.005) break;
            scale = next;
        }
        return scale;
    }

    function buildPoster(kind) {
        const box = el('poster');
        const content = posterHtml();
        box.className = 'measure';
        let pageSize;
        if (kind === 'a2') {
            const k = POSTER.a2;
            box.innerHTML = `<div class="pz-page a2"><div class="pz-view"><div class="pz-area">${content}</div></div></div>`;
            const scale = fitPoster(box, k.area);
            box.dataset.scale = String(scale);
            pageSize = k.page;
        } else {
            const k = POSTER.tiles;
            const step = [k.view[0] - k.overlap, k.view[1] - k.overlap];
            const area = [step[0] + k.view[0], step[1] + k.view[1]];
            // Measured once, then the same scale is given to each copy.
            box.innerHTML = `<div class="pz-page"><div class="pz-area">${content}</div></div>`;
            const scale = fitPoster(box, area);
            const width = box.querySelector('.poster').style.width;
            const pad = box.querySelector('.poster').style.getPropertyValue('--pz-pad');
            const where = ['горе лево', 'горе десно', 'долу лево', 'долу десно'];
            box.innerHTML = [0, 1, 2, 3].map((n) => {
                const col = n % 2, row = Math.floor(n / 2);
                const glue = [col === 0 ? 'десниот раб оди под дел ' + (n + 2) : '', row === 0 ? 'долниот раб оди под дел ' + (n + 3) : '']
                    .filter(Boolean).join(' · ');
                return '<div class="pz-page tile"><div class="pz-view">'
                    + `<div class="pz-area" style="transform:translate(${-col * step[0]}mm,${-row * step[1]}mm)">${content}</div></div>`
                    + `<div class="pz-note"><span>Дел ${n + 1} од 4 · ${where[n]}${glue ? ' — ' + glue + ' (1 cm се преклопува)' : ''}</span>`
                    + '<span>сечи по испрекинатата линија, лепи ги деловите со преклоп</span></div></div>';
            }).join('');
            box.querySelectorAll('.poster').forEach((p) => {
                p.style.width = width;
                if (pad) p.style.setProperty('--pz-pad', pad);
                p.style.transform = scale < 1 ? `scale(${scale})` : '';
            });
            box.dataset.scale = String(scale);
            pageSize = k.page;
        }
        box.className = '';
        let page = document.getElementById('posterPage');
        if (!page) { page = document.createElement('style'); page.id = 'posterPage'; document.head.appendChild(page); }
        page.textContent = `@page { size: ${pageSize[0]}mm ${pageSize[1]}mm; margin: 0; }`;
        document.body.dataset.print = kind;
    }

    function clearPoster() {
        delete document.body.dataset.print;
        const page = document.getElementById('posterPage');
        if (page) page.remove();
        el('poster').innerHTML = '';
    }
    window.addEventListener('afterprint', clearPoster);

    function printAs(kind) {
        el('printMenu').hidden = true;
        el('printBtn').setAttribute('aria-expanded', 'false');
        if (kind === 'screen' || !data) { clearPoster(); window.print(); return; }
        buildPoster(kind);
        window.print();
    }

    el('printBtn').addEventListener('click', (event) => {
        event.stopPropagation();
        // The other views print their own sheets, as before.
        if (view !== 'week') { window.print(); return; }
        const open = el('printMenu').hidden;
        el('printMenu').hidden = !open;
        el('printBtn').setAttribute('aria-expanded', String(open));
    });
    el('printMenu').addEventListener('click', (event) => {
        const choice = event.target.closest('[data-print]');
        if (choice) printAs(choice.dataset.print);
    });
    document.addEventListener('click', (event) => {
        if (!el('printMenu').hidden && !event.target.closest('.print-wrap')) {
            el('printMenu').hidden = true;
            el('printBtn').setAttribute('aria-expanded', 'false');
        }
    });

    /**
     * A key is „класа|час" in a single-day view and „ден|класа|час" in the
     * weekly one. The same class and period exist five times in a week, so
     * without the day a Friday cell would open Monday's lesson — and it would
     * look entirely plausible.
     */
    function cellForKey(key) {
        if (!data) return null;
        const parts = String(key).split('|');
        const ordinal = Number(parts[parts.length - 1]);
        if (parts.length >= 3) {
            const day = parts[0];
            const label = parts.slice(1, -1).join('|');
            return data.cells.find((c) =>
                c.day === day && c.class === label && c.ordinal === ordinal) || null;
        }
        const label = parts.slice(0, -1).join('|');
        return data.cells.find((c) => c.class === label && c.ordinal === ordinal) || null;
    }

    /**
     * Личен распоред — неделата на ЕДЕН наставник, лист по лист.
     *
     * Сопственикот (25 септември): изгледот на сликата од формуларите, но за
     * секој наставник, со она што му треба нему — кога кој ученик му излегува
     * од часот и кај кој терапевт. Ова е единствениот приказ на страницата
     * наменет да се печати и да му се даде на човекот, па еден наставник е
     * еден лист (A4, положено).
     *
     * ПРЕГРУПИРАЊЕ, не второ пресметување. Кој третман на кој час паѓа го
     * решава `lib/crossing.ts`; тука само се чита истиот одговор по наставник.
     * „Цела недела" е истото, сите наставници во една мрежа.
     */
    const SCHOOL = 'ОУРЦ „Кочо Рацин“ – Битола';
    const NOBODY = '— без наставник —';
    const cap = (d) => String(d || '').charAt(0).toUpperCase() + String(d || '').slice(1);
    const clock = (slots) => (slots || []).join(', ').replace(/-/g, '–');

    // ── 👤 Наставник · недела ───────────────────────────────────────────
    // The sheet, its pickers and the rules of who picks what (одделенски: the
    // subject in their own class; предметен: the class, then one of their
    // subjects) are ONE copy in mtb-teacher-week.js, shared with Податоци's
    // „🗓️ Распоред". A second copy here would be corrected once and not twice.
    const TW = () => window.MTBTeacherWeek;
    const personalWeeks = () => TW().week(data);
    const personalEntries = (list) => TW().entries(list);
    const editOn = () => TW().editing();

    function drawPersonal() {
        const W = TW();
        const w = personalWeeks();
        const editing = editOn();
        // Typing a new week in needs every day on the sheet, not only the days
        // that already have a lesson.
        const days = editing ? W.DAYS : w.days;
        // Not under a picker that is open or being chosen in.
        if (editing) W.loadOffers(data, apiBase(), () => { if (data && view === 'personal' && editOn() && !W.choosing()) draw(); });
        // The choice survives a redraw; a name that is no longer on the list
        // falls back to everybody rather than to an empty page.
        const wanted = w.names.includes(el('who').value) ? el('who').value : '';
        el('who').innerHTML = '<option value="">Сите наставници</option>'
            + w.names.map((n) => `<option value="${esc(n)}"${n === wanted ? ' selected' : ''}>${esc(n)}</option>`).join('');
        if (!days.length || !w.periods.length) {
            el('grid').innerHTML = '<div class="offline"><p>Нема внесени часови за оваа година.</p></div>';
            return;
        }
        // „Сите" is for printing the whole staff room, so a teacher with no
        // lesson yet would be a blank sheet of paper. Chosen by name, they get
        // their sheet anyway, and it says why it is empty. While editing,
        // everybody on the list: that blank sheet is where their week goes.
        const shown = wanted ? [wanted] : editing ? w.names : w.names.filter((n) => w.rows.get(n).size);
        const footer = 'Настава ↔ терапии · ' + new Date().toLocaleDateString('mk-MK');
        el('grid').innerHTML = shown.map((name) => W.sheetHtml(w, data, name, { editing, footer, png: true })).join('')
            || '<div class="offline"><p>Нема наставник со внесени часови.</p></div>';
    }

    /**
     * 🏫 Паралелка · недела (owner, 27 Sep 2026) — the one sheet a class
     * needs: its week, and under each lesson which child leaves it, for which
     * cabinet, and when. It replaced „По одделение", „Ден по ден",
     * „Известувања" and „По кабинет", which were this same answer cut into
     * a day at a time, a number without names, a list without the week, and
     * the cabinet's side without the class. „Сите паралелки" is one sheet per
     * class, a page each — the notice that is handed to the class.
     *
     * A REGROUPING, like every view here: which lesson a session lands in is
     * decided once, in `lib/crossing.ts`.
     */
    function classEntries(list) {
        const out = [];
        const seen = new Set();
        list.forEach((c) => out.push({ kind: 'lesson', text: c.subject || 'без предмет', sub: c.teacher || 'без наставник' }));
        // One child out of the period is one line, however many lessons share it.
        list.forEach((c) => (c.away || []).forEach((a) => {
            const key = (a.studentPublicId || a.student) + '|' + a.therapist;
            if (seen.has(key)) return;
            seen.add(key);
            out.push({ kind: 'away', text: '↳ ' + a.student, sub: a.therapist + (a.slots && a.slots.length ? ' · ' + clock(a.slots) : ''), who: a.therapist });
        }));
        return out;
    }

    function classWeeks() {
        const periods = data.bells.teaching || [];
        const days = DAYS.filter((d) => data.cells.some((c) => c.day === d));
        const { offList, order } = classRows();
        const slots = new Map();
        data.cells.forEach((c) => {
            const at = c.class + '|' + c.day + '|' + c.ordinal;
            if (!slots.has(at)) slots.set(at, []);
            slots.get(at).push(c);
        });
        return { periods, days, order, offList, slots };
    }

    function drawClassWeek() {
        const { periods, days, order, offList, slots } = classWeeks();
        const wanted = order.includes(el('klass').value) ? el('klass').value : '';
        el('klass').innerHTML = '<option value="">Сите паралелки</option>'
            + order.map((l) => `<option value="${esc(l)}"${l === wanted ? ' selected' : ''}>${esc(classShort(l))}</option>`).join('');
        if (!days.length || !periods.length) {
            el('grid').innerHTML = '<div class="offline"><p>Нема внесени часови за оваа година.</p></div>';
            return;
        }
        const shown = wanted ? [wanted] : order.filter((l) => data.cells.some((c) => c.class === l));
        const printed = new Date().toLocaleDateString('mk-MK');
        const yearLabel = data.year + (data.isCurrentYear ? '' : ' · архивски приказ');
        el('grid').innerHTML = shown.map((label) => {
            const mine = data.cells.filter((c) => c.class === label);
            const pupils = new Set();
            let away = 0;
            const seen = new Set();
            mine.forEach((c) => (c.away || []).forEach((a) => {
                const key = c.day + '|' + c.ordinal + '|' + (a.studentPublicId || a.student) + '|' + a.therapist;
                if (!seen.has(key)) { seen.add(key); away++; }
                pupils.add(a.studentPublicId || a.student);
            }));
            const homeroom = (data.teachers || []).filter((t) => t.homeroom === label).map((t) => t.name);
            const sub = [SCHOOL, 'учебна ' + yearLabel,
                homeroom.length ? 'раководител ' + homeroom.join(', ') : '',
                mine.length + (mine.length === 1 ? ' час' : ' часа') + ' неделно',
                away ? `${pupils.size} ${pupils.size === 1 ? 'ученик' : 'ученици'} · ${away} ${away === 1 ? 'излегување' : 'излегувања'} на третман`
                    : 'никој не излегува на третман',
                offList.has(label) ? 'не е на списокот оваа година' : ''].filter(Boolean).join(' · ');
            // The teacher's sheet's own cell and switch (mtb-teacher-week.js): one
            // fixed size, the therapies side by side, hidden to a coloured strip.
            const W = TW();
            const body = periods.map((p) => '<tr>'
                + `<th><b>${esc(String(p.ordinal))}. час</b><small>${esc(p.startsAt)}</small></th>`
                + days.map((d) => '<td>' + W.readCellHtml(classEntries(slots.get(label + '|' + d + '|' + p.ordinal) || []), data) + '</td>').join('')
                + '</tr>').join('');
            return `<section class="personal show-${W.mode()}" data-class="${esc(label)}">`
                + `<div class="p-head"><h3>Паралелка ${esc(classShort(label))} — неделен распоред</h3><div class="p-sub">${esc(sub)}</div></div>`
                + W.modesHtml()
                + '<table class="p-grid"><thead><tr><th>Час</th>'
                + days.map((d) => `<th>${esc(cap(d))}</th>`).join('') + '</tr></thead>'
                + `<tbody>${body}</tbody></table>`
                + (mine.length ? '' : '<p class="quiet">Сè уште нема ниту еден час во распоредот.</p>')
                + `<div class="p-foot"><span>Настава ↔ терапии · ${esc(printed)}</span><span>`
                + (offList.has(label) ? '' : `<a class="btn soft" href="${esc(editWeekHref(label))}">✏️ Уреди ја неделата</a> `)
                + (window.MTBScheduleForm ? `<button type="button" class="btn soft p-png" data-png-class="${esc(label)}">🖼 Слика</button>` : '')
                + '</span></div></section>';
        }).join('') || '<div class="offline"><p>Нема паралелка со внесени часови.</p></div>';
    }

    function classPicture(label) {
        const { periods, days, slots } = classWeeks();
        if (!window.MTBScheduleForm) return;
        window.MTBScheduleForm.paintGrid({
            title: 'Паралелка ' + classShort(label) + ' — неделен распоред',
            subtitle: SCHOOL + ' · учебна ' + data.year,
            days,
            rows: periods.map((p) => ({ label: p.ordinal + '. час', time: p.startsAt })),
            cells: periods.map((p) => days.map((d) => classEntries(slots.get(label + '|' + d + '|' + p.ordinal) || [])
                .map((e) => ({ text: e.text, sub: e.sub })))),
            footer: 'Настава ↔ терапии · ' + new Date().toLocaleDateString('mk-MK'),
            file: 'Paralelka-' + label.replace(/[\\/:*?"<>|\s]+/g, '-') + '.png'
        });
    }

    /**
     * The same sheet as a PNG, drawn by the forms' own painter
     * (`mtb-schedule-form.js`), so it is the same picture colleagues already
     * get from a form — the look the owner asked for.
     */
    function personalPicture(name) {
        const { periods, days, rows } = personalWeeks();
        const slots = rows.get(name);
        if (!slots || !window.MTBScheduleForm) return;
        window.MTBScheduleForm.paintGrid({
            title: 'Неделен распоред — ' + name,
            subtitle: SCHOOL + ' · учебна ' + data.year,
            days,
            rows: periods.map((p) => ({ label: p.ordinal + '. час', time: p.startsAt })),
            cells: periods.map((p) => days.map((d) => personalEntries(slots.get(d + '|' + p.ordinal) || [])
                .map((e) => ({ text: e.text, sub: e.sub })))),
            footer: 'Настава ↔ терапии · ' + new Date().toLocaleDateString('mk-MK'),
            file: 'Licen-raspored-' + name.replace(/[\\/:*?"<>|\s]+/g, '-') + '.png'
        });
    }

    /** Clicking, not hovering: this gets read on a tablet in a staff room. */
    function show(key) {
        const cell = cellForKey(key);
        const box = el('detail');
        if (!cell || !cell.awayCount) {
            box.className = 'panel detail'; box.innerHTML = '';
            selected = null; markSelected(); return;
        }
        selected = key;
        const period = (data.bells.teaching || []).find((p) => p.ordinal === cell.ordinal);
        // The day belongs in the heading of ANY view that holds more than one:
        // the same class and period exist five times in a week, so a panel that
        // names only „I-а · 2. час" is describing one of five lessons and does
        // not say which. Tied to `wholeWeek()` rather than to a view name, or
        // the next week-wide view added forgets it again — which is exactly how
        // this was missed when „Ден по ден" landed.
        const when = wholeWeek() ? esc(cell.day) + ' · ' : '';
        box.className = 'panel detail open';
        box.innerHTML =
            '<button type="button" class="detail-x" data-close-detail aria-label="Затвори" title="Затвори (Esc)">✕</button>'
            + `<h3>${when}${esc(cell.class)} · ${cell.ordinal}. час${period ? ' · ' + esc(period.startsAt) : ''}</h3>`
            + `<div class="meta">${esc(cell.subject || 'без предмет')} · ${esc(cell.teacher || 'без наставник')}`
            + (cell.teacherOnStaff === false ? ' · не е на списокот оваа година' : '')
            + '</div>'
            + `<ul>${cell.away.map((a) =>
                `<li><b>${esc(a.student)}</b> — ${esc(a.therapist)} <span class="meta">(${a.minutes} мин од часот)</span></li>`
              ).join('')}</ul>`;
        markSelected();
    }

    /**
     * What the hover card says about one lesson.
     *
     * „Никој не е на третман" is a real answer and is shown as one. A lesson
     * nobody is taken out of is the common case, and a tooltip that appears
     * blank reads like a page that is broken.
     */
    function tipFor(cell) {
        if (!cell) return '';
        const head = `<h4>${esc(cell.class)} · ${cell.ordinal}. час</h4>`
            + `<div class="meta">${esc(cell.subject || 'без предмет')} · ${esc(cell.teacher || 'без наставник')}`
            + (cell.teacherOnStaff === false ? ' · вон списокот' : '')
            + '</div>';
        if (!cell.awayCount) return head + '<div class="meta">Никој не е на третман.</div>';
        return head + `<ul>${cell.away.map((a) =>
            `<li>${esc(a.student)} — ${esc(a.therapist)} <span class="meta">(${a.minutes} мин)</span></li>`
          ).join('')}</ul>`;
    }

    function hideTip() {
        tipCell = null;
        const tip = el('tip');
        tip.style.display = 'none';
        tip.setAttribute('aria-hidden', 'true');
    }

    /**
     * The card is `position: fixed`, so it must be told where its cell went.
     * Hiding it on scroll instead READ as a bug: the weekly grid scrolls
     * sideways, and the browser scrolls a cell into view AFTER the pointer
     * reaches it — so the card appeared and vanished in the same breath.
     * Measured in a browser; it is not a hypothetical.
     */
    function placeTip(td) {
        const tip = el('tip');
        const box = td.getBoundingClientRect();
        if (!box.width || box.bottom < 0 || box.top > window.innerHeight) { hideTip(); return; }
        const w = tip.offsetWidth, h = tip.offsetHeight;
        // Below the cell by default, above it when the page has run out of room.
        const top = box.bottom + 8 + h > window.innerHeight ? box.top - h - 8 : box.bottom + 8;
        tip.style.top = Math.max(8, top) + 'px';
        tip.style.left = Math.max(8, Math.min(box.left, window.innerWidth - w - 8)) + 'px';
    }

    function markSelected() {
        document.querySelectorAll('#grid .cell').forEach((td) => {
            td.classList.toggle('selected', !!td.dataset.key && td.dataset.key === selected);
        });
    }

    /**
     * The sessions that could not be attached to a lesson, and why.
     *
     * This is the honest half of the page. Folding "VI" into "VI-а" would empty
     * this list and put children in rooms they were never in, so nothing is
     * folded and the work stays visible.
     */
    function reasonText(row) {
        switch (row.reasonCode) {
            case 'no-class':      return 'ученикот нема запишано одделение';
            // Two sentences where there used to be one, because they are two
            // different jobs. „Не постои во распоредот" read as a fault in the
            // child's record when the usual truth is the opposite: the class is
            // formed and on the list, and its timetable is simply not typed in.
            case 'class-not-timetabled':
                return `одделението „${row.grade}" е на списокот, но нема ниту еден внесен час`;
            case 'unknown-class':
                return `одделението „${row.grade}" не е ни во распоредот, ни на списокот паралелки оваа година`;
            case 'unknown-bell':  return `терминот ${row.time_slot} не одговара на ниту еден час во кабинетот`;
            case 'external':      return 'екстерен ученик без доделено одделение/група за оваа година';
            default:              return row.reason || 'непознато';
        }
    }

    /**
     * What to DO about the list, above the list.
     *
     * Twenty rows all saying „II-а has no lessons" are one job, not twenty, and
     * a backlog that reads as twenty is one nobody starts. Grouped by the pair
     * (reason, class) — the pair, because the same class can be unplaceable for
     * two different reasons on two different days and folding those together
     * would hide the one that is actually fixable.
     */
    function unplacedJobs(rows) {
        const jobs = new Map();
        rows.forEach((r) => {
            const key = r.reasonCode + '|' + (r.grade || '');
            if (!jobs.has(key)) jobs.set(key, { row: r, terms: 0, pupils: new Set() });
            const job = jobs.get(key);
            job.terms++;
            job.pupils.add(r.studentPublicId || r.student);
        });
        return [...jobs.values()].sort((a, b) => b.terms - a.terms);
    }

    function drawUnplaced() {
        const box = el('unplaced');
        const rows = (data && data.unplaced) || [];
        if (!rows.length) { box.style.display = 'none'; box.innerHTML = ''; return; }
        box.style.display = '';
        const jobs = unplacedJobs(rows);
        box.innerHTML = `<h3>Неповрзани третмани: ${rows.length}</h3>`
            + '<ul class="jobs">' + jobs.map((j) =>
                `<li><b>${esc(reasonText(j.row))}</b>`
                + `<span class="meta"> — ${j.terms} ${j.terms === 1 ? 'термин' : 'термини'}, `
                + `${j.pupils.size} ${j.pupils.size === 1 ? 'ученик' : 'ученици'}`
                + (j.row.reasonCode === 'class-not-timetabled'
                    ? ' · внеси ги часовите во „Уреди настава"'
                    : j.row.reasonCode === 'unknown-class'
                        ? ' · провери го одделението во „Податоци"' : '')
                + '</span></li>').join('') + '</ul>'
            + '<table><thead><tr><th>Ученик</th><th>Одделение</th><th>Термин</th><th>Терапевт</th><th>Причина</th></tr></thead><tbody>'
            + rows.slice(0, 60).map((r) =>
                `<tr><td>${esc(r.student)}</td><td>${esc(r.grade || '—')}</td><td>${esc(r.time_slot)}</td>`
