                + `<td>${esc(r.therapist)}</td><td class="why">${esc(reasonText(r))}</td></tr>`
              ).join('')
            + '</tbody></table>'
            + (rows.length > 60 ? `<p class="meta">…и уште ${rows.length - 60}.</p>` : '');
    }

    /**
     * External pupils without an assigned local teaching class are listed
     * apart. This is not proof they attend no teaching: assignments can be
     * incomplete. An assigned external pupil participates in the crossing.
     */
    function drawExternal() {
        const box = el('external');
        const rows = (data && data.external) || [];
        if (!rows.length) { box.style.display = 'none'; box.innerHTML = ''; return; }
        box.style.display = '';
        const names = Array.from(new Set(rows.map((r) => r.student)))
            .sort((a, b) => a.localeCompare(b, 'mk'));
        box.innerHTML = `<h3>Екстерни без доделено одделение/група: ${names.length}</h3>`
            + `<p class="meta">Не може да се одреди час за вкрстување. Ако посетуваат настава кај нас, додели одделение/група во „Податоци“. За ученици само на третмани, полето може да остане празно. `
            + `${rows.length} ${rows.length === 1 ? 'термин' : 'термини'} вкупно.</p>`
            + '<table><thead><tr><th>Ученик</th><th>Термин</th><th>Терапевт</th></tr></thead><tbody>'
            + rows.slice(0, 60).map((r) =>
                `<tr><td>${esc(r.student)}</td><td>${esc(r.time_slot)}</td><td>${esc(r.therapist)}</td></tr>`).join('')
            + '</tbody></table>'
            + (rows.length > 60 ? `<p class="meta">…и уште ${rows.length - 60}.</p>` : '');
    }

    const VIEW_BUTTONS = { classweek: 'viewClassWeek', personal: 'viewPersonal', week: 'viewWeek' };
    // The views that went on 27 Sep 2026, so an old bookmark lands on what replaced it.
    const RETIRED = { class: 'classweek', days: 'classweek', notice: 'classweek', cabinet: 'classweek', teacher: 'personal' };
    function markView() {
        Object.entries(VIEW_BUTTONS).forEach(([name, id]) => el(id).setAttribute('aria-pressed', String(view === name)));
        el('whoField').hidden = view !== 'personal';
        el('klassField').hidden = view !== 'classweek';
        // The sheets always name the children; only the overview counts them.
        el('namedField').hidden = view !== 'week';
        el('personalEdit').hidden = view !== 'personal';
        // The print rules differ per view: a personal sheet prints the sheets
        // and nothing else from the page.
        document.body.dataset.view = view;
    }

    function setView(next) {
        const wasWhole = wholeWeek();
        view = VIEW_BUTTONS[next] ? next : (RETIRED[next] || 'classweek');
        markView();
        // Панелот на клик опишува ќелија што во новиот приказ веќе ја нема —
        // а на листот со известувања стоеше под него како да е дел од листот.
        selected = null;
        el('detail').className = 'panel detail';
        el('detail').innerHTML = '';
        hideTip();
        // A week-wide view holds every day and a daily one holds one, so this
        // is a different REQUEST, not a different drawing of the same answer.
        if (wasWhole !== wholeWeek()) load(); else draw();
    }

    el('year').addEventListener('change', () => {
        const url = new URL(window.location.href);
        url.searchParams.set('year', el('year').value);
        window.history.replaceState(null, '', url);
        load();
    });
    el('klass').addEventListener('change', draw);
    el('share').addEventListener('change', load);
    // Само друго цртање на истиот одговор — нема повторно барање.
    el('who').addEventListener('change', draw);
    el('refresh').addEventListener('click', load);
    // Само друго цртање на истиот одговор — нема повторно барање.
    el('hoverCard').addEventListener('change', () => {
        hoverCard = el('hoverCard').checked;
        if (!hoverCard) hideTip();
    });
    const closeDetail = () => {
        el('detail').className = 'panel detail';
        el('detail').innerHTML = '';
        selected = null;
        markSelected();
    };
    el('detail').addEventListener('click', (event) => {
        if (event.target.closest('[data-close-detail]')) closeDetail();
    });
    document.addEventListener('keydown', (event) => {
        if (event.key === 'Escape' && el('detail').classList.contains('open')) closeDetail();
    });
    // Во променлива, не во localStorage — како двете погоре.
    el('hand').addEventListener('change', () => {
        hand = el('hand').checked;
        fitGrid();
    });
    window.addEventListener('resize', fitGrid);
    el('named').addEventListener('change', () => {
        named = el('named').checked;
        document.body.classList.toggle('named', named);
        draw();
    });
    // A view the person chose is a step in the browser's history, so „назад"
    // returns to the previous view instead of leaving the page; the view is in
    // the address too, so a reload keeps it (`app-navigation.js`, `views`).
    let viewHistory = null;
    Object.entries(VIEW_BUTTONS).forEach(([name, id]) => el(id).addEventListener('click', () => {
        if (name === view) return;
        setView(name);
        if (viewHistory) viewHistory.step({ view: name });
    }));
    document.addEventListener('DOMContentLoaded', () => {
        const nav = window.MTBAppNavigation;
        if (nav && nav.views) viewHistory = nav.views({ keys: ['view'], show: (v) => setView(v.view || 'class') });
    });
    {
        const wanted = new URLSearchParams(window.location.search).get('view');
        if (VIEW_BUTTONS[wanted] || RETIRED[wanted]) view = VIEW_BUTTONS[wanted] ? wanted : RETIRED[wanted];
        // Always: the tab, the chooser beside it and the print rules follow the view.
        markView();
    }
    // ✏️ A picker in Личен распоред: written at once, one period at a time,
    // and 🔒/🔓 in the sheet's corner — both handled by mtb-teacher-week.js.
    TW().attach(el('grid'), { data: () => data, reload: load, redraw: draw, apiBase, status });
    // The switch in the bar (or the Workspace's top bar) turns the pickers on
    // and off; nothing else on this page changes with it.
    window.addEventListener('mtb:editing', () => { if (data && view === 'personal') draw(); });
    // mtb-forms.js is loaded after this script, so the switch is bound once it is there.
    document.addEventListener('DOMContentLoaded', () => {
        if (window.MTBForms) window.MTBForms.bindSwitch(el('personalEdit'));
        else el('personalEdit').remove();
    });
    el('grid').addEventListener('click', (event) => {
        const png = event.target.closest('[data-png]');
        if (png) { personalPicture(png.dataset.png); return; }
        const pngClass = event.target.closest('[data-png-class]');
        if (pngClass) { classPicture(pngClass.dataset.pngClass); return; }
        const td = event.target.closest('.cell.clickable');
        if (td) show(td.dataset.key);
    });

    // Hover is the quick look. The click panel above stays exactly as it was,
    // because this page is read on a tablet in a staff room, where there is no
    // hover at all — so nothing may depend on it alone.
    el('grid').addEventListener('mouseover', (event) => {
        if (!hoverCard) return;
        const td = event.target.closest('.cell[data-key]');
        if (!td) return;
        const html = tipFor(cellForKey(td.dataset.key));
        if (!html) return;
        const tip = el('tip');
        tip.innerHTML = html;
        tip.style.display = 'block';
        tip.setAttribute('aria-hidden', 'false');
        tipCell = td;
        placeTip(td);
    });
    el('grid').addEventListener('mouseleave', hideTip);
    window.addEventListener('scroll', () => { if (tipCell) placeTip(tipCell); }, true);
    window.addEventListener('resize', hideTip);

    // Written in another window — a lesson, a term, a pupil's class: the
    // crossing is read again, and the lesson that was open stays open with
    // what is true now.
    document.addEventListener('DOMContentLoaded', () => {
        const nav = window.MTBAppNavigation;
        if (!nav || !nav.onDataChange) return;
        nav.onDataChange(async () => {
            const open = selected;
            await load();
            if (open && data) show(open);
        });
    });

    load();
})();
</script>
<script src="mtb-schedule-form.js"></script>
<script src="mtb-forms.js"></script>
<script src="app-navigation.js"></script>
<div id="tip" role="tooltip" aria-hidden="true"></div>
</body>
</html>
