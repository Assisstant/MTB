00%;border:0;background:#fff}.directory{min-width:0;background:var(--panel);border-left:1px solid var(--line);display:grid;grid-template-rows:auto auto auto minmax(0,1fr);overflow:hidden}.main.panel-hidden .directory{display:none}.dir-head{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line)}.dir-head h2{font-size:15px;margin:0;flex:1}.dir-head span{font-size:11px;color:var(--muted)}.dir-tabs{display:flex;gap:5px;padding:8px 10px;border-bottom:1px solid var(--line)}.dir-tabs button{flex:1;padding:7px;font-size:12px}.tools{display:flex;gap:7px;padding:8px 10px;border-bottom:1px solid var(--line)}.tools input,.tools select,.editor input,.editor select{width:100%;background:var(--input);border:1px solid var(--line);border-radius:6px;color:var(--text);padding:8px}.tools input{flex:1}.tools select{width:150px}.directory-content{min-height:0;overflow:hidden}.split{height:100%;display:grid;grid-template-columns:42% 58%;min-height:0}.master{min-height:0;border-right:1px solid var(--line);display:grid;grid-template-rows:auto minmax(0,1fr)}.master-title,.editor-title{padding:9px 10px;font-size:12px;font-weight:800;color:#d7d8ea;border-bottom:1px solid var(--line)}.list{overflow:auto;min-height:0;padding:5px}.person{display:grid;grid-template-columns:24px minmax(0,1fr) auto;gap:6px;align-items:center;width:100%;border:1px solid transparent;border-radius:6px;background:transparent;color:var(--text);padding:7px;text-align:left}.person:hover{background:#242644}.person.active{background:#2b2d52;border-color:#615ba5}.person .num{font-size:11px;color:var(--muted);text-align:right}.person .name{min-width:0;font-size:12px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.person .meta{font-size:10px;color:var(--muted);white-space:nowrap}.editor{overflow:auto;min-height:0;padding:10px}.empty{color:var(--muted);font-size:13px;padding:22px;text-align:center}.field{display:grid;gap:5px;margin-bottom:10px}.field label,.section-label{font-size:11px;color:var(--muted);font-weight:700}.row{display:flex;gap:8px;align-items:center}.row>*{min-width:0}.actions{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0 14px}.note{font-size:11px;color:var(--muted);line-height:1.45}.badge{display:inline-flex;padding:2px 6px;border-radius:999px;background:#30325a;color:#dfe0ff;font-size:10px}.class-grid{display:grid;grid-template-columns:1fr 1fr;gap:5px;max-height:250px;overflow:auto;padding:4px 0}.class-row{display:grid;grid-template-columns:18px 1fr 92px;gap:5px;align-items:center;background:#20213e;border:1px solid var(--line);border-radius:6px;padding:6px;font-size:11px}.class-row select{padding:5px;font-size:10px}.caseload{border-top:1px solid var(--line);margin-top:12px;padding-top:10px}.caseload-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}.caseload-head b{font-size:12px;flex:1}.caseload-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;min-height:0}.pick-box{border:1px solid var(--line);border-radius:7px;background:#171832;display:grid;grid-template-rows:auto minmax(0,1fr);height:330px;overflow:hidden}.pick-head{padding:7px 8px;border-bottom:1px solid var(--line);font-size:11px;font-weight:800;display:flex;align-items:center;gap:6px}.pick-head input{min-width:0;flex:1;background:#121329;border:1px solid var(--line);color:var(--text);border-radius:5px;padding:5px}.pick-list{overflow:auto;padding:4px}.pick-row{display:grid;grid-template-columns:18px minmax(0,1fr) auto;gap:5px;align-items:center;padding:5px;border-radius:5px;font-size:11px}.pick-row:hover{background:#252744}.pick-row .pname{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.icon{border:0;background:transparent;color:#beb9ff;padding:2px 4px;font-weight:900}.icon:hover{color:#fff}.save-state{font-size:11px;min-height:16px;color:var(--muted)}.save-state.ok{color:var(--ok)}.save-state.error{color:#ff9baa}.back{display:none;margin-bottom:8px}.back.show{display:inline-flex}.panel-toggle{position:absolute;right:10px;top:10px;z-index:20;border:1px solid var(--line);background:#1b1c39;color:white;border-radius:6px;padding:6px 8px}.main:not(.panel-hidden) .panel-toggle{display:none}@media(max-width:1200px){.main{grid-template-columns:minmax(0,1fr) 520px}.split{grid-template-columns:38% 62%}}@media(max-width:900px){body{overflow:auto}.workspace{height:auto;min-height:100vh}.main{display:block}.stage{height:58vh}.directory{height:78vh;border-left:0;border-top:1px solid var(--line)}.main.panel-hidden .directory{display:none}.split{grid-template-columns:1fr}.master{max-height:240px;border-right:0;border-bottom:1px solid var(--line)}.caseload-grid{grid-template-columns:1fr}.pick-box{height:220px}.status{display:none}.year-wrap{margin-left:auto}}

<div class="workspace">
<header class="topbar"><div class="brand">MTB <small>работен простор</small></div><div class="app-tabs" id="appTabs"><button data-app="RasporediFusion.html" class="active">Распоред</button><button data-app="NastavaUredi.html">Настава</button><button data-app="AkciskiPlan.html">Евидентен лист</button><button data-app="S-Dnevnik.html">S-Дневник</button><button data-app="Pregled-Baza.html">Преглед база</button></div><div class="year-wrap"><span>Година</span><select id="year"></select></div><button class="soft compact" id="refresh">↻</button><div class="status" id="status">Се поврзувам…</div><button class="soft compact" id="hidePanel">Скриј податоци</button></header>
<div class="main" id="main"><section class="stage"><button class="panel-toggle" id="showPanel">Податоци</button><iframe id="appFrame" src="RasporediFusion.html" title="MTB апликација"></iframe></section><aside class="directory" aria-label="Заеднички податоци"><div class="dir-head"><div><h2>Заеднички податоци</h2><span>истата PostgreSQL база · уредување без напуштање на работата</span></div></div><div class="dir-tabs" id="dirTabs"><button data-dir="students" class="active">Ученици</button><button data-dir="teachers">Наставници</button><button data-dir="therapists">Стручни / терапевти</button></div><div class="tools"><input id="search" type="search" placeholder="Пребарај…"><select id="kindFilter"><option value="">Сите</option><option value="internal">Интерни</option><option value="boarding">Интернатски</option><option value="external">Екстерни</option></select></div><div class="directory-content" id="content"></div></aside></div>

<script>
(function(){'use strict';const $=id=>document.getElementById(id),esc=v=>String(v==null?'':v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'),tidy=v=>String(v==null?'':v).replace(/\s+/g,' ').trim(),personName=value=>{const clean=tidy(value),letters=clean.replace(/[^\p{L}]/gu,'');if(!letters||letters!==letters.toLocaleUpperCase('mk-MK'))return clean;return clean.toLocaleLowerCase('mk-MK').replace(/(^|[\s\-‐‑–—'’])(\p{L})/gu,(_,b,l)=>b+l.toLocaleUpperCase('mk-MK'))};const PUBLISHED=location.hostname==='assisstant.github.io',SERVER_KEY='mtb_podatoci_server_v1';let apiBase='',years=[],data=null,categories=[],categoryOf={teacher:{},therapist:{}},dir='students',selected={students:null,teachers:null,therapists:null},draftCaseload=new Set(),caseloadOriginal=new Set(),returnTherapist=null,ticket=0;
function setStatus(text,kind){const n=$('status');n.textContent=text||'';n.className='status'+(kind?' '+kind:'')}function activeServer(){if(!PUBLISHED)return /^https?:$/.test(location.protocol)?location.origin:'';try{const raw=localStorage.getItem(SERVER_KEY)||'';if(!raw)return'';const u=new URL(raw);if(u.protocol!=='https:'||!u.hostname.endsWith('.ts.net'))return'';return u.origin}catch(_){return''}}async function api(method,path,body){if(!apiBase)throw new Error('Не е избрана PostgreSQL база.');const res=await fetch(apiBase+path,{method,cache:'no-store',headers:body===undefined?undefined:{'Content-Type':'application/json'},body:body===undefined?undefined:JSON.stringify(body)});let out=null;try{out=await res.json()}catch(_){}if(!res.ok)throw new Error(out&&(out.error||out.message)||'HTTP '+res.status);return out}
async function load(preferYear){const mine=++ticket;apiBase=activeServer();if(!apiBase){data=null;render();setStatus('Избери база во start.html','warn');return}setStatus('Вчитувам од базата…');try{years=await api('GET','/api/years');if(mine!==ticket)return;const current=years.find(y=>y.is_current)||years[0],wanted=preferYear||$('year').value||current&&current.label||'';$('year').innerHTML=years.map(y=>'<option value="'+esc(y.label)+'"'+(y.label===wanted?' selected':'')+'>'+esc(y.label)+(y.is_current?' · тековна':' · архива')+'</option>').join('');const year=$('year').value||wanted,[roster,cats,holders]=await Promise.all([api('GET','/api/roster?year='+encodeURIComponent(year)),api('GET','/api/categories').catch(()=>({categories:[]})),api('GET','/api/categories/holders?year='+encodeURIComponent(year)).catch(()=>({teachers:[],therapists:[]}))]);if(mine!==ticket)return;data=roster;categories=cats.categories||[];categoryOf={teacher:{},therapist:{}};(holders.teachers||[]).forEach(x=>categoryOf.teacher[x.personId]=x.categoryId);(holders.therapists||[]).forEach(x=>categoryOf.therapist[x.personId]=x.categoryId);preserveSelection();render();setStatus(roster.year+' · '+roster.students.length+' ученици · '+roster.teachers.length+' наставници · '+roster.therapists.length+' стручни/терапевти','ok')}catch(err){data=null;render();setStatus(err.message,'error')}}
function preserveSelection(){for(const key of ['students','teachers','therapists']){const old=selected[key];if(!old)continue;const id=key==='students'?old.public_id:old.id,next=(data[key]||[]).find(x=>(key==='students'?x.public_id:x.id)===id);selected[key]=next||null}if(selected.therapists){caseloadOriginal=new Set(selected.therapists.students||[]);if(!draftCaseload.size)draftCaseload=new Set(caseloadOriginal)}}function render(){$('kindFilter').style.display=dir==='students'?'':'none';if(!data){$('content').innerHTML='<div class="empty">Нема вчитани податоци од базата.</div>';return}dir==='students'?renderStudents():dir==='teachers'?renderTeachers():renderTherapists()}function q(){return tidy($('search').value).toLocaleLowerCase('mk-MK')}
function masterRow(kind,item,index,meta){const id=kind==='students'?item.public_id:item.id,active=selected[kind]&&(kind==='students'?selected[kind].public_id:selected[kind].id)===id;return'<button class="person'+(active?' active':'')+'" data-pick="'+esc(String(id))+'"><span class="num">'+(index+1)+'.</span><span class="name">'+esc(personName(item.name))+'</span><span class="meta">'+esc(meta||'')+'</span></button>'}function bindMaster(kind){document.querySelectorAll('[data-pick]').forEach(b=>b.addEventListener('click',()=>{const raw=b.dataset.pick;selected[kind]=(data[kind]||[]).find(x=>String(kind==='students'?x.public_id:x.id)===raw)||null;if(kind==='therapists'){caseloadOriginal=new Set(selected.therapists?.students||[]);draftCaseload=new Set(caseloadOriginal)}render()}))}function studentMeta(s){return[s.grade||'',s.kind||''].filter(Boolean).join(' · ')}function filteredStudents(){const needle=q(),k=$('kindFilter').value;return(data.students||[]).filter(s=>s.active!==false).filter(s=>!k||(s.kind||'internal')===k).filter(s=>!needle||personName(s.name).toLocaleLowerCase('mk-MK').includes(needle)||String(s.grade||'').toLocaleLowerCase('mk-MK').includes(needle))}
function categoryOptions(kind,id){const held=categoryOf[kind][id]||'';return'<option value="">— без категорија —</option>'+categories.map(c=>'<option value="'+c.id+'"'+(String(c.id)===String(held)?' selected':'')+'>'+esc(c.name)+'</option>').join('')}function classOptions(selectedGrade){return'<option value="">— без одделение / група —</option>'+(data.classes||[]).map(c=>'<option value="'+esc(c.label)+'"'+(c.label===selectedGrade?' selected':'')+'>'+esc(c.label)+'</option>').join('')}
function renderStudents(){const rows=filteredStudents(),s=selected.students;$('content').innerHTML='<div class="split"><section class="master"><div class="master-title">Ученици · '+rows.length+'</div><div class="list">'+rows.map((x,i)=>masterRow('students',x,i,studentMeta(x))).join('')+'</div></section><section class="editor">'+(s?studentEditor(s):'<div class="empty">Избери ученик за преглед или измена.</div>')+'</section></div>';bindMaster('students');if(s)bindStudentEditor(s)}function studentEditor(s){return'<button class="soft compact back'+(returnTherapist?' show':'')+'" id="backToCaseload">← Назад кон листата</button><div class="editor-title">Ученик</div><div class="field"><label>Име и презиме</label><input id="sName" value="'+esc(personName(s.name))+'"></div><div class="row"><div class="field" style="flex:1"><label>Статус</label><select id="sKind"><option value="internal"'+((s.kind||'internal')==='internal'?' selected':'')+'>интерен</option><option value="boarding"'+(s.kind==='boarding'?' selected':'')+'>интернатски</option><option value="external"'+(s.kind==='external'?' selected':'')+'>екстерен</option></select></div><div class="field" style="flex:1"><label>Одделение / група</label><select id="sGrade">'+classOptions(s.grade||'')+'</select></div></div><div class="actions"><button class="primary" id="saveStudent">Зачувај ученик</button></div><div class="save-state" id="editorState"></div><p class="note">Ова ги менува заедничките податоци во PostgreSQL. Не создава копија во овој работен простор.</p>'}
function bindStudentEditor(s){$('saveStudent').addEventListener('click',async()=>{const btn=$('saveStudent');btn.disabled=true;state('Зачувувам…');try{await api('PATCH','/api/students/'+encodeURIComponent(s.public_id),{name:personName($('sName').value),kind:$('sKind').value,grade:tidy($('sGrade').value)||null,year:data.year,expected:s.name});await load(data.year);selectStudent(s.public_id);state('Зачувано во базата.','ok')}catch(e){state(e.message,'error')}finally{btn.disabled=false}});if($('backToCaseload'))$('backToCaseload').addEventListener('click',()=>{const id=returnTherapist;returnTherapist=null;dir='therapists';selectDirButton();selected.therapists=(data.therapists||[]).find(t=>t.id===id)||selected.therapists;if(selected.therapists){caseloadOriginal=new Set(selected.therapists.students||[]);draftCaseload=new Set(caseloadOriginal)}render()})}function selectStudent(id){selected.students=(data.students||[]).find(x=>x.public_id===id)||null;render()}function state(text,kind){const n=$('editorState');if(!n)return;n.textContent=text||'';n.className='save-state'+(kind?' '+kind:'')}
function filteredPeople(kind){const needle=q();return(data[kind]||[]).filter(x=>!needle||personName(x.name).toLocaleLowerCase('mk-MK').includes(needle)||String(x.subject||'').toLocaleLowerCase('mk-MK').includes(needle))}function renderTeachers(){const rows=filteredPeople('teachers'),t=selected.teachers;$('content').innerHTML='<div class="split"><section class="master"><div class="master-title">Наставници · '+rows.length+'</div><div class="list">'+rows.map((x,i)=>masterRow('teachers',x,i,x.kind==='odd'?'одделенски':x.subject||'предметен')).join('')+'</div></section><section class="editor">'+(t?teacherEditor(t):'<div class="empty">Избери наставник за измена.</div>')+'</section></div>';bindMaster('teachers');if(t)bindTeacherEditor(t)}function teacherEditor(t){const map=new Map((t.classes||[]).map(c=>[c.label,c.role]));return'<div class="editor-title">Наставник</div><div class="field"><label>Име и презиме</label><input id="tName" value="'+esc(personName(t.name))+'"></div><div class="row"><div class="field" style="flex:1"><label>Улога</label><select id="tKind"><option value="odd"'+(t.kind==='odd'?' selected':'')+'>одделенски наставник</option><option value="pred"'+(t.kind==='pred'?' selected':'')+'>предметен наставник</option></select></div><div class="field" style="flex:1"><label>Предмет</label><input id="tSubject" value="'+esc(t.subject||'')+'"></div></div><div class="field"><label>Стручна категорија</label><select id="tCategory">'+categoryOptions('teacher',t.id)+'</select></div><div class="section-label">Одделенија оваа година</div><div class="class-grid">'+(data.classes||[]).map(c=>'<label class="class-row"><input type="checkbox" data-class="'+esc(c.label)+'"'+(map.has(c.label)?' checked':'')+'><span>'+esc(c.label)+'</span><select data-role="'+esc(c.label)+'"><option value="subject"'+(map.get(c.label)==='homeroom'?'':' selected')+'>предава</option><option value="homeroom"'+(map.get(c.label)==='homeroom'?' selected':'')+'>раководител</option></select></label>').join('')+'</div><div class="actions"><button class="primary" id="saveTeacher">Зачувај наставник</button></div><div class="save-state" id="editorState"></div>'}
function bindTeacherEditor(t){const sync=()=>{$('tSubject').disabled=$('tKind').value==='odd';if($('tKind').value==='odd')$('tSubject').value=''};$('tKind').addEventListener('change',sync);sync();$('tCategory').addEventListener('change',()=>saveCategory('teacher',t.id,$('tCategory').value));$('saveTeacher').addEventListener('click',async()=>{const btn=$('saveTeacher');btn.disabled=true;state('Зачувувам…');try{const kind=$('tKind').value;await api('PUT','/api/teaching/teacher/'+t.id,{name:personName($('tName').value),kind,subject:kind==='pred'?tidy($('tSubject').value)||null:null});const classes=Array.from(document.querySelectorAll('[data-class]')).filter(x=>x.checked).map(x=>({label:x.dataset.class,role:document.querySelector('[data-role="'+CSS.escape(x.dataset.class)+'"]').value}));await api('PUT','/api/teaching/teacher/'+t.id+'/classes',{year:data.year,classes});await load(data.year);selected.teachers=(data.teachers||[]).find(x=>x.id===t.id)||null;render();state('Зачувано во базата.','ok')}catch(e){state(e.message,'error')}finally{btn.disabled=false}})}async function saveCategory(kind,id,value){state('Ја зачувувам категоријата…');try{await api('PUT','/api/categories/holder',{year:data.year,kind,personId:id,categoryId:value?Number(value):null});categoryOf[kind][id]=value?Number(value):null;state('Категоријата е зачувана.','ok')}catch(e){state(e.message,'error');await load(data.year)}}
function renderTherapists(){const rows=filteredPeople('therapists'),t=selected.therapists;$('content').innerHTML='<div class="split"><section class="master"><div class="master-title">Стручни / терапевти · '+rows.length+'</div><div class="list">'+rows.map((x,i)=>masterRow('therapists',x,i,(x.students||[]).length+' ученици')).join('')+'</div></section><section class="editor">'+(t?therapistEditor(t):'<div class="empty">Избери лице за податоци и список на ученици.</div>')+'</section></div>';bindMaster('therapists');if(t)bindTherapistEditor(t)}function therapistEditor(t){return'<div class="editor-title">Стручен соработник / терапевт</div><div class="field"><label>Име и презиме</label><input id="thName" value="'+esc(personName(t.name))+'"></div><div class="field"><label>Стручна категорија</label><select id="thCategory">'+categoryOptions('therapist',t.id)+'</select></div><div class="actions"><button class="primary" id="saveTherapist">Зачувај податоци</button></div><div class="save-state" id="editorState"></div><div class="caseload"><div class="caseload-head"><b>Ученици кај '+esc(personName(t.name))+'</b><span class="badge" id="selectedCount">'+draftCaseload.size+' избрани</span></div><div class="caseload-grid"><div class="pick-box"><div class="pick-head"><span>Сите ученици</span><input id="caseloadSearch" placeholder="барај"></div><div class="pick-list" id="allStudents"></div></div><div class="pick-box"><div class="pick-head"><span>Избрани</span><span class="badge" id="selectedCount2">'+draftCaseload.size+'</span></div><div class="pick-list" id="selectedStudents"></div></div></div><div class="actions"><button class="primary" id="saveCaseload">Зачувај список</button><button class="soft" id="resetCaseload">Врати</button></div><p class="note">Левата и десната листа се скролаат независно. ✎ отвора податоци за ученикот без да се напушти работниот простор.</p></div>'}
function bindTherapistEditor(t){$('thCategory').addEventListener('change',()=>saveCategory('therapist',t.id,$('thCategory').value));$('saveTherapist').addEventListener('click',async()=>{const to=personName($('thName').value),from=t.name;if(!to||to===from){state('Нема промена.');return}const btn=$('saveTherapist');btn.disabled=true;state('Зачувувам…');try{await api('PATCH','/api/therapists/'+encodeURIComponent(from),{name:to});await load(data.year);selected.therapists=(data.therapists||[]).find(x=>personName(x.name)===to)||selected.therapists;if(selected.therapists){caseloadOriginal=new Set(selected.therapists.students||[]);draftCaseload=new Set(caseloadOriginal)}render();state('Зачувано во базата.','ok')}catch(e){state(e.message,'error')}finally{btn.disabled=false}});$('caseloadSearch').addEventListener('input',drawCaseloadLists);$('resetCaseload').addEventListener('click',()=>{draftCaseload=new Set(caseloadOriginal);drawCaseloadLists()});$('saveCaseload').addEventListener('click',()=>saveCaseload(t));drawCaseloadLists()}function caseloadCandidates(){const needle=tidy($('caseloadSearch')?.value||'').toLocaleLowerCase('mk-MK');return(data.students||[]).filter(s=>s.active!==false).filter(s=>!needle||personName(s.name).toLocaleLowerCase('mk-MK').includes(needle)||String(s.grade||'').toLocaleLowerCase('mk-MK').includes(needle))}
function drawCaseloadLists(){const all=$('allStudents'),chosen=$('selectedStudents');if(!all||!chosen)return;const rows=caseloadCandidates();all.innerHTML=rows.map(s=>'<label class="pick-row"><input type="checkbox" data-caseload-id="'+esc(s.public_id)+'"'+(draftCaseload.has(s.public_id)?' checked':'')+'><span class="pname">'+esc(personName(s.name))+(s.grade?' · '+esc(s.grade):'')+'</span><button type="button" class="icon" data-edit-student="'+esc(s.public_id)+'" title="Уреди ученик">✎</button></label>').join('');const selectedRows=(data.students||[]).filter(s=>draftCaseload.has(s.public_id));chosen.innerHTML=selectedRows.length?selectedRows.map(s=>'<div class="pick-row"><span></span><span class="pname">'+esc(personName(s.name))+(s.grade?' · '+esc(s.grade):'')+'</span><span><button type="button" class="icon" data-edit-student="'+esc(s.public_id)+'" title="Уреди ученик">✎</button><button type="button" class="icon" data-drop-student="'+esc(s.public_id)+'" title="Тргни од избрани">×</button></span></div>').join(''):'<div class="empty">Нема избрани.</div>';document.querySelectorAll('[data-caseload-id]').forEach(c=>c.addEventListener('change',()=>{c.checked?draftCaseload.add(c.dataset.caseloadId):draftCaseload.delete(c.dataset.caseloadId);drawCaseloadLists()}));document.querySelectorAll('[data-drop-student]').forEach(b=>b.addEventListener('click',()=>{draftCaseload.delete(b.dataset.dropStudent);drawCaseloadLists()}));document.querySelectorAll('[data-edit-student]').forEach(b=>b.addEventListener('click',()=>openStudentFromCaseload(b.dataset.editStudent)));if($('selectedCount'))$('selectedCount').textContent=draftCaseload.size+' избрани';if($('selectedCount2'))$('selectedCount2').textContent=draftCaseload.size}function openStudentFromCaseload(id){returnTherapist=selected.therapists?.id||null;dir='students';selected.students=(data.students||[]).find(s=>s.public_id===id)||null;selectDirButton();render()}
async function saveCaseload(t){const add=[...draftCaseload].filter(x=>!caseloadOriginal.has(x)),drop=[...caseloadOriginal].filter(x=>!draftCaseload.has(x));if(!add.length&&!drop.length){state('Нема промена.');return}const btn=$('saveCaseload');btn.disabled=true;state('Зачувувам список…');const name=encodeURIComponent(t.name),year='?year='+encodeURIComponent(data.year);try{for(const id of add)await api('PUT','/api/therapists/'+name+'/students/'+encodeURIComponent(id)+year);for(const id of drop)await api('DELETE','/api/therapists/'+name+'/students/'+encodeURIComponent(id)+year);const therapistId=t.id;await load(data.year);selected.therapists=(data.therapists||[]).find(x=>x.id===therapistId)||null;if(selected.therapists){caseloadOriginal=new Set(selected.therapists.students||[]);draftCaseload=new Set(caseloadOriginal)}render();state('Списокот е зачуван: +'+add.length+' / −'+drop.length,'ok')}catch(e){state(e.message,'error');await load(data.year);selected.therapists=(data.therapists||[]).find(x=>x.id===t.id)||null;if(selected.therapists){caseloadOriginal=new Set(selected.therapists.students||[]);draftCaseload=new Set(caseloadOriginal)}render()}finally{btn.disabled=false}}
function selectDirButton(){document.querySelectorAll('#dirTabs button').forEach(b=>b.classList.toggle('active',b.dataset.dir===dir));$('kindFilter').style.display=dir==='students'?'':'none'}document.querySelectorAll('#dirTabs button').forEach(b=>b.addEventListener('click',()=>{dir=b.dataset.dir;returnTherapist=null;$('search').value='';selectDirButton();render()}));$('search').addEventListener('input',render);$('kindFilter').addEventListener('change',render);$('year').addEventListener('change',()=>load($('year').value));$('refresh').addEventListener('click',()=>load($('year').value));$('hidePanel').addEventListener('click',()=>$('main').classList.add('panel-hidden'));$('showPanel').addEventListener('click',()=>$('main').classList.remove('panel-hidden'));document.querySelectorAll('#appTabs button').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('#appTabs button').forEach(x=>x.classList.toggle('active',x===b));$('appFrame').src=b.dataset.app}));$('appFrame').addEventListener('load',()=>{try{const d=$('appFrame').contentDocument,nav=d&&d.getElementById('mtbAppNav');if(nav)nav.style.display='none'}catch(_){}});window.addEventListener('mtb:server-selected',()=>load());window.addEventListener('storage',e=>{if(e.key===SERVER_KEY)load()});load()})();
</script>
