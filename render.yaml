# Optional blueprint only. Creating a service is a separate, manual decision.
services:
  - type: web
    name: mtb-cloud-test
    runtime: node
    plan: free
    repo: https://github.com/Assisstant/MTB
    branch: main
    autoDeployTrigger: off
    buildCommand: npm ci --prefix server --include=dev
    startCommand: npm run deploy:workspace --prefix server && npm start --prefix server
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: HOST
        value: "0.0.0.0"
      - key: NODE_ENV
        value: production
      - key: MTB_CLOUD_AUTH
        value: google
      - key: DATABASE_URL
        sync: false
      - key: MTB_GOOGLE_CLIENT_ID
        sync: false
      - key: MTB_GOOGLE_CLIENT_SECRET
        sync: false
      - key: MTB_GOOGLE_ALLOWED_EMAIL
        sync: false
      - key: MTB_SESSION_SECRET
        sync: false
      # Who may open Податоци → Формулари (the review queue for offline form
      # answers): therapist:Име Презиме or teacher:Име Презиме, as in the
      # database. Set in the dashboard; without it the queue refuses everyone.
      - key: MTB_ADMIN
        sync: false
      # „изработил …" at the foot of every screen. The name is set here in the
      # dashboard and never in this public repository (check:names refuses it).
      - key: MTB_AUTHOR
        sync: false
      - key: MTB_CLOUD_ORIGIN
        sync: false
      - key: MTB_SERVER_ID
        value: cloud-test
      - key: MTB_SERVER_LABEL
        value: MTB cloud test
      # Supabase -> local mirror export remains opt-in. Enabling it and setting
      # the secret is a separate reviewed rollout step.
      - key: MTB_MIRROR_EXPORT
        value: "0"
      - key: MTB_MIRROR_EXPORT_KEY
        sync: false
